name: Refresh Nuvio Homepage

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Build Nuvio iOS SideStore"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: nuvio-homepage
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh GitHub homepage

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      # ========================================================
      # Clone publishing branch WITHOUT actions/checkout
      # ========================================================
      - name: Clone publishing branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git init .

          git remote add origin \
            "https://github.com/$GITHUB_REPOSITORY.git"

          AUTH="$(
            printf 'x-access-token:%s' "$GH_TOKEN" \
              | base64 \
              | tr -d '\n'
          )"

          git \
            -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch \
            --no-tags \
            --depth=1 \
            origin \
            refs/heads/cmp-rewrite

          git checkout \
            -B cmp-rewrite \
            FETCH_HEAD

          echo
          echo "Repository ready:"
          git status --short --branch

      # ========================================================
      # Read SideStore metadata
      # ========================================================
      - name: Read current Nuvio metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_FILE="sidestore/source.json"

          if [[ ! -f "$SOURCE_FILE" ]]; then
            echo "Missing $SOURCE_FILE" >&2
            exit 1
          fi

          VERSION="$(
            jq -r '
              .apps[0].versions[0].version
              // .apps[0].version
              // empty
            ' "$SOURCE_FILE"
          )"

          MIN_OS="$(
            jq -r '
              .apps[0].versions[0].minOSVersion
              // empty
            ' "$SOURCE_FILE"
          )"

          DOWNLOAD_URL="$(
            jq -r '
              .apps[0].versions[0].downloadURL
              // .apps[0].downloadURL
              // empty
            ' "$SOURCE_FILE"
          )"

          if [[ -z "$VERSION" ]]; then
            echo "Could not determine current version." >&2
            exit 1
          fi

          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "Could not determine current IPA URL." >&2
            exit 1
          fi

          RELEASE_TAG="$(
            printf '%s\n' "$DOWNLOAD_URL" \
              | sed -E \
              's#.*\/releases\/download\/([^/]+)\/.*#\1#'
          )"

          OFFICIAL_TAG="${RELEASE_TAG#ios-}"

          if [[ -z "$MIN_OS" ]]; then
            MIN_OS="Unknown"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "min_os=$MIN_OS" >> "$GITHUB_OUTPUT"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "official_tag=$OFFICIAL_TAG" >> "$GITHUB_OUTPUT"

          echo
          echo "Version:      $VERSION"
          echo "Minimum OS:   $MIN_OS"
          echo "Release tag:  $RELEASE_TAG"
          echo "Official tag: $OFFICIAL_TAG"

      # ========================================================
      # Read GitHub Release
      # ========================================================
      - name: Read current iOS release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body // ""' \
            > /tmp/nuvio-ios-release.md

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '
              [
                .assets[]
                | select(.name | endswith(".ipa"))
                | .digest
                // empty
              ][0] // ""
            ' \
            > /tmp/nuvio-ipa-digest.txt

      # ========================================================
      # Read official Nuvio logo
      # ========================================================
      - name: Read official Nuvio branding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_TAG: ${{ steps.metadata.outputs.official_tag }}
        run: |
          set -euo pipefail

          gh api \
            "repos/NuvioMedia/NuvioMobile/contents/README.md?ref=$OFFICIAL_TAG" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode \
            > /tmp/nuvio-official-readme.md

          export OFFICIAL_TAG

          python3 <<'PY'
          import html
          import os
          import re
          from pathlib import Path

          tag = os.environ["OFFICIAL_TAG"]

          text = Path(
              "/tmp/nuvio-official-readme.md"
          ).read_text(
              encoding="utf-8",
              errors="replace",
          )

          candidates = []

          candidates.extend(
              re.findall(
                  r'<img[^>]+src=["\']([^"\']+)["\']',
                  text,
                  flags=re.IGNORECASE,
              )
          )

          candidates.extend(
              re.findall(
                  r'!\[[^\]]*\]\(([^)\s]+)',
                  text,
              )
          )

          logo = ""

          for candidate in candidates:
              candidate = html.unescape(
                  candidate.strip()
              )

              lowered = candidate.lower()

              if (
                  "logo" in lowered
                  or "nuvio" in lowered
                  or "banner" in lowered
              ):
                  logo = candidate
                  break

          if not logo and candidates:
              logo = html.unescape(
                  candidates[0].strip()
              )

          if logo:
              if logo.startswith(
                  ("http://", "https://")
              ):
                  logo_url = logo

              elif logo.startswith("/"):
                  logo_url = (
                      "https://raw.githubusercontent.com/"
                      "NuvioMedia/NuvioMobile/"
                      f"{tag}{logo}"
                  )

              else:
                  relative = logo

                  while relative.startswith("./"):
                      relative = relative[2:]

                  logo_url = (
                      "https://raw.githubusercontent.com/"
                      "NuvioMedia/NuvioMobile/"
                      f"{tag}/{relative}"
                  )

          else:
              logo_url = ""

          Path(
              "/tmp/nuvio-logo-url.txt"
          ).write_text(
              logo_url,
              encoding="utf-8",
          )

          print(
              f"Nuvio logo URL: {logo_url or 'not detected'}"
          )
          PY

      # ========================================================
      # Generate main README + EN / SK / CZ
      # ========================================================
      - name: Generate polished multilingual pages
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          MIN_OS: ${{ steps.metadata.outputs.min_os }}
          DOWNLOAD_URL: ${{ steps.metadata.outputs.download_url }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          OFFICIAL_TAG: ${{ steps.metadata.outputs.official_tag }}
        run: |
          set -euo pipefail

          mkdir -p docs/readme

          python3 <<'PY'
          import json
          import os
          import re
          import urllib.parse
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]

          version = os.environ["VERSION"]
          min_os = os.environ["MIN_OS"]
          download_url = os.environ["DOWNLOAD_URL"]
          release_tag = os.environ["RELEASE_TAG"]
          official_tag = os.environ["OFFICIAL_TAG"]

          source = json.loads(
              Path(
                  "sidestore/source.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          app = source["apps"][0]
          versions = app.get("versions", [])

          if not versions:
              raise SystemExit(
                  "source.json contains no versions."
              )

          current = versions[0]

          changelog = (
              current.get("localizedDescription")
              or app.get("versionDescription")
              or f"Nuvio {version}"
          ).strip()

          release_body = Path(
              "/tmp/nuvio-ios-release.md"
          ).read_text(
              encoding="utf-8",
              errors="replace",
          )

          digest = Path(
              "/tmp/nuvio-ipa-digest.txt"
          ).read_text(
              encoding="utf-8",
              errors="replace",
          ).strip()

          logo_url = Path(
              "/tmp/nuvio-logo-url.txt"
          ).read_text(
              encoding="utf-8",
              errors="replace",
          ).strip()

          def table_value(label):
              pattern = (
                  r"^\|\s*"
                  + re.escape(label)
                  + r"\s*\|\s*(.*?)\s*\|$"
              )

              match = re.search(
                  pattern,
                  release_body,
                  flags=re.MULTILINE | re.IGNORECASE,
              )

              if not match:
                  return ""

              value = match.group(1)
              value = re.sub(r"[*`]", "", value)

              return value.strip()

          build_number = (
              table_value("Build")
              or "See release"
          )

          supported_devices = (
              table_value("Supported devices")
              or "iPhone & iPad"
          )

          official_commit = (
              table_value("Official source commit")
              or "See release"
          )

          if digest.startswith("sha256:"):
              sha256 = digest.split(":", 1)[1]
          else:
              sha256 = (
                  table_value("IPA SHA256")
                  or "See release"
              )

          lowered_devices = supported_devices.lower()

          if (
              "iphone" in lowered_devices
              and "ipad" in lowered_devices
          ):
              minimum_os_label = (
                  f"iOS / iPadOS {min_os}+"
              )

          elif "ipad" in lowered_devices:
              minimum_os_label = (
                  f"iPadOS {min_os}+"
              )

          elif "iphone" in lowered_devices:
              minimum_os_label = (
                  f"iOS {min_os}+"
              )

          else:
              minimum_os_label = (
                  f"{min_os}+"
              )

          source_url = (
              "https://raw.githubusercontent.com/"
              f"{repo}/cmp-rewrite/"
              "sidestore/source.json"
          )

          release_url = (
              f"https://github.com/{repo}/"
              f"releases/tag/{release_tag}"
          )

          official_url = (
              "https://github.com/"
              "NuvioMedia/NuvioMobile/"
              f"tree/{official_tag}"
          )

          official_repo = (
              "https://github.com/"
              "NuvioMedia/NuvioMobile"
          )

          def badge(label, message, color):
              label_q = urllib.parse.quote(
                  label,
                  safe="",
              )

              message_q = urllib.parse.quote(
                  message,
                  safe="",
              )

              return (
                  "https://img.shields.io/badge/"
                  f"{label_q}-{message_q}-{color}"
                  "?style=for-the-badge"
              )

          version_badge = badge(
              "VERSION",
              version,
              "2188ff",
          )

          os_badge = badge(
              "MINIMUM OS",
              minimum_os_label,
              "555555",
          )

          devices_badge = badge(
              "DEVICES",
              supported_devices,
              "2ea44f",
          )

          full_badge = badge(
              "DISTRIBUTION",
              "FULL",
              "6f42c1",
          )

          unsigned_badge = badge(
              "SIGNING",
              "UNSIGNED IPA",
              "e67e22",
          )

          auto_badge = badge(
              "UPDATES",
              "AUTOMATIC",
              "00a4ef",
          )

          if logo_url:
              hero = (
                  '<p align="center">\n'
                  f'<img src="{logo_url}" '
                  'alt="Nuvio" width="460">\n'
                  '</p>'
              )
          else:
              hero = (
                  '<h1 align="center">'
                  'NUVIO'
                  '</h1>'
              )

          status_badges = (
              '<p align="center">\n'
              f'<img src="{version_badge}" alt="Version"> '
              f'<img src="{os_badge}" alt="Minimum OS"> '
              f'<img src="{devices_badge}" alt="Devices"><br>\n'
              f'<img src="{full_badge}" alt="Distribution"> '
              f'<img src="{unsigned_badge}" alt="Signing"> '
              f'<img src="{auto_badge}" alt="Automatic updates">\n'
              '</p>'
          )

          action_buttons = (
              '<p align="center">\n'
              f'<a href="{release_url}">'
              '<img src="https://img.shields.io/badge/'
              'GitHub_Release-VIEW_LATEST-2ea44f'
              '?style=for-the-badge&logo=github" '
              'alt="View latest release"></a> '
              f'<a href="{download_url}">'
              '<img src="https://img.shields.io/badge/'
              'IPA-DOWNLOAD_LATEST-2188ff'
              '?style=for-the-badge&logo=apple" '
              'alt="Download IPA"></a>\n'
              '</p>'
          )

          language_buttons = (
              '<p align="center">\n'
              '<a href="docs/readme/README_EN.md">'
              '<img src="https://img.shields.io/badge/'
              'ENGLISH-OPEN_GUIDE-2188ff'
              '?style=for-the-badge" '
              'alt="English"></a> '

              '<a href="docs/readme/README_SK.md">'
              '<img src="https://img.shields.io/badge/'
              'SLOVEN%C4%8CINA-OTVORI%C5%A4_N%C3%81VOD'
              '-2ea44f?style=for-the-badge" '
              'alt="Slovenčina"></a> '

              '<a href="docs/readme/README_CZ.md">'
              '<img src="https://img.shields.io/badge/'
              '%C4%8CE%C5%A0TINA-OTEV%C5%98%C3%8DT_N%C3%81VOD'
              '-e67e22?style=for-the-badge" '
              'alt="Čeština"></a>\n'
              '</p>'
          )

          sidestore_button = (
              '<p align="center">\n'
              f'<a href="{source_url}">'
              '<img src="https://img.shields.io/badge/'
              'SideStore-source.json-6f42c1'
              '?style=for-the-badge&logo=apple" '
              'alt="SideStore source.json"></a>\n'
              '</p>'
          )

          main = f"""
          <!--
          AUTO-GENERATED FILE.
          Managed by .github/workflows/refresh-readme.yml
          -->

          {hero}

          <h2 align="center">
          Unofficial iOS / iPadOS SideStore Builds
          </h2>

          <p align="center">
          Community-maintained clean unsigned IPA builds created automatically
          from official Nuvio releases.
          </p>

          {status_badges}

          > [!IMPORTANT]
          > **This is an unofficial distribution of Nuvio.**
          >
          > This repository is not affiliated with or endorsed by NuvioMedia.
          > The application source code is **not modified**.
          > Builds are generated from matching official
          > `NuvioMedia/NuvioMobile` releases.

          <h2 align="center">🚀 Latest Build</h2>

          <p align="center">
          <strong>Nuvio {version}</strong><br>
          Build {build_number} · {minimum_os_label} · {supported_devices}<br>
          FULL distribution · Unsigned IPA
          </p>

          {action_buttons}

          <h2 align="center">🌍 Choose your language</h2>

          <p align="center">
          Choose a complete guide in your preferred language.
          </p>

          {language_buttons}

          <p align="center">
          🇬🇧 English &nbsp;&nbsp; • &nbsp;&nbsp;
          🇸🇰 Slovenčina &nbsp;&nbsp; • &nbsp;&nbsp;
          🇨🇿 Čeština
          </p>

          <h2 align="center">🔗 SideStore Automatic Updates</h2>

          <p align="center">
          Add the source below once and receive future Nuvio iOS / iPadOS
          releases through SideStore.
          </p>

          ```text
          {source_url}
          ```

          {sidestore_button}

          <p align="center">
          <strong>SideStore → Sources → Add Source</strong>
          </p>

          <h2 align="center">✨ What's New in {version}</h2>

          {changelog}

          ---

          <h2 align="center">🔎 Build Verification</h2>

          <details>
          <summary><strong>Show technical build information</strong></summary>

          ```text
          Official repository: NuvioMedia/NuvioMobile
          Official tag:        {official_tag}
          Official commit:     {official_commit}
          Version:             {version}
          Build:               {build_number}
          Minimum OS:          {minimum_os_label}
          Supported devices:   {supported_devices}
          Distribution:        FULL
          Signing:             Unsigned IPA
          IPA SHA256:          {sha256}
          ```

          </details>

          ---

          <h2 align="center">❤️ Official Nuvio Project</h2>

          <p align="center">
          This repository only provides unofficial community-built
          iOS / iPadOS packages.<br><br>
          <strong>
          <a href="{official_repo}">
          NuvioMedia/NuvioMobile
          </a>
          </strong><br><br>
          Official source used for this build:
          <a href="{official_url}">{official_tag}</a>
          </p>

          <p align="center">
          💜 Thank you for supporting Nuvio and the community.
          </p>
          """

          en = f"""
          {hero}

          <h1 align="center">
          🇬🇧 Nuvio iOS / iPadOS — English Guide
          </h1>

          <p align="center">
          <a href="../../README.md">← Back to main page</a>
          </p>

          {status_badges}

          > [!IMPORTANT]
          > This is an **unofficial community-built Nuvio IPA**.
          > It is not an official NuvioMedia distribution.

          <h2 align="center">📱 Current Version</h2>

          <p align="center">
          <strong>Nuvio {version}</strong><br>
          Build {build_number}<br>
          {minimum_os_label}<br>
          {supported_devices}<br>
          FULL · Unsigned IPA
          </p>

          {action_buttons}

          <h2 align="center">🔗 SideStore Automatic Updates</h2>

          ```text
          {source_url}
          ```

          {sidestore_button}

          <p align="center">
          SideStore → Sources → Add Source
          </p>

          <h2 align="center">✨ What's New in {version}</h2>

          {changelog}

          <h2 align="center">ℹ️ About This Build</h2>

          - Application source code is not modified.
          - Built from official Nuvio release **{official_tag}**.
          - FULL distribution.
          - Unsigned IPA intended for SideStore.
          - Community maintained.
          - Not affiliated with NuvioMedia.

          <p align="center">
          <a href="../../README.md">← Back to main page</a>
          </p>
          """

          sk = f"""
          {hero}

          <h1 align="center">
          🇸🇰 Nuvio pre iOS / iPadOS — Slovenský návod
          </h1>

          <p align="center">
          <a href="../../README.md">← Späť na hlavnú stránku</a>
          </p>

          {status_badges}

          > [!IMPORTANT]
          > Toto je **neoficiálny komunitný build Nuvio**.
          > Nejde o oficiálnu distribúciu spoločnosti NuvioMedia.

          <h2 align="center">📱 Aktuálna verzia</h2>

          <p align="center">
          <strong>Nuvio {version}</strong><br>
          Build {build_number}<br>
          {minimum_os_label}<br>
          {supported_devices}<br>
          FULL · Nepodpísaná IPA
          </p>

          {action_buttons}

          <h2 align="center">🔗 Automatické aktualizácie cez SideStore</h2>

          <p align="center">
          V SideStore otvor <strong>Sources → Add Source</strong>
          a pridaj tento zdroj:
          </p>

          ```text
          {source_url}
          ```

          {sidestore_button}

          <h2 align="center">✨ Čo je nové vo verzii {version}</h2>

          {changelog}

          <h2 align="center">ℹ️ O tomto builde</h2>

          - Zdrojový kód aplikácie neupravujeme.
          - Build vzniká z oficiálnej verzie Nuvio **{official_tag}**.
          - Používa sa distribúcia **FULL**.
          - IPA nie je podpísaná a je určená pre SideStore.
          - Projekt je komunitne udržiavaný.
          - Nejde o oficiálnu distribúciu NuvioMedia.

          <h2 align="center">🔎 Overenie</h2>

          <details>
          <summary><strong>Zobraziť technické údaje</strong></summary>

          ```text
          Oficiálny tag:     {official_tag}
          Oficiálny commit:  {official_commit}
          IPA SHA256:        {sha256}
          ```

          </details>

          <p align="center">
          <a href="../../README.md">← Späť na hlavnú stránku</a>
          </p>
          """

          cz = f"""
          {hero}

          <h1 align="center">
          🇨🇿 Nuvio pro iOS / iPadOS — Český návod
          </h1>

          <p align="center">
          <a href="../../README.md">← Zpět na hlavní stránku</a>
          </p>

          {status_badges}

          > [!IMPORTANT]
          > Toto je **neoficiální komunitní build Nuvio**.
          > Nejde o oficiální distribuci společnosti NuvioMedia.

          <h2 align="center">📱 Aktuální verze</h2>

          <p align="center">
          <strong>Nuvio {version}</strong><br>
          Build {build_number}<br>
          {minimum_os_label}<br>
          {supported_devices}<br>
          FULL · Nepodepsaná IPA
          </p>

          {action_buttons}

          <h2 align="center">🔗 Automatické aktualizace přes SideStore</h2>

          <p align="center">
          V SideStore otevři <strong>Sources → Add Source</strong>
          a přidej tento zdroj:
          </p>

          ```text
          {source_url}
          ```

          {sidestore_button}

          <h2 align="center">✨ Co je nového ve verzi {version}</h2>

          {changelog}

          <h2 align="center">ℹ️ O tomto buildu</h2>

          - Zdrojový kód aplikace neupravujeme.
          - Build vzniká z oficiální verze Nuvio **{official_tag}**.
          - Používá se distribuce **FULL**.
          - IPA není podepsaná a je určena pro SideStore.
          - Projekt je komunitně udržovaný.
          - Nejde o oficiální distribuci NuvioMedia.

          <h2 align="center">🔎 Ověření</h2>

          <details>
          <summary><strong>Zobrazit technické údaje</strong></summary>

          ```text
          Oficiální tag:     {official_tag}
          Oficiální commit:  {official_commit}
          IPA SHA256:        {sha256}
          ```

          </details>

          <p align="center">
          <a href="../../README.md">← Zpět na hlavní stránku</a>
          </p>
          """

          def clean(text):
              lines = []

              for line in text.splitlines():
                  if line.startswith("          "):
                      lines.append(
                          line[10:]
                      )
                  else:
                      lines.append(line)

              return "\n".join(lines).strip() + "\n"

          Path("README.md").write_text(
              clean(main),
              encoding="utf-8",
          )

          Path(
              "docs/readme/README_EN.md"
          ).write_text(
              clean(en),
              encoding="utf-8",
          )

          Path(
              "docs/readme/README_SK.md"
          ).write_text(
              clean(sk),
              encoding="utf-8",
          )

          Path(
              "docs/readme/README_CZ.md"
          ).write_text(
              clean(cz),
              encoding="utf-8",
          )

          print()
          print("========================================")
          print("Polished Nuvio pages generated")
          print("========================================")
          print(f"Version: {version}")
          print(f"OS: {minimum_os_label}")
          print(f"Devices: {supported_devices}")
          print("========================================")
          PY

      # ========================================================
      # Commit + push WITHOUT actions/checkout
      # ========================================================
      - name: Commit homepage and language guides
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add docs/readme/README_EN.md
          git add docs/readme/README_SK.md
          git add docs/readme/README_CZ.md

          if git diff --cached --quiet; then
            echo "All pages are already current."
            exit 0
          fi

          git commit \
            -m "docs: polish multilingual Nuvio homepage"

          AUTH="$(
            printf 'x-access-token:%s' "$GH_TOKEN" \
              | base64 \
              | tr -d '\n'
          )"

          git \
            -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            push \
            origin \
            HEAD:cmp-rewrite

          echo
          echo "Homepage and language guides published."
