          """

          # ==================================================
          # Clean indentation + write files
          # ==================================================

          def clean(text):
              lines = []

              for line in text.splitlines():

                  if line.startswith(
                      "          "
                  ):
                      lines.append(
                          line[10:]
                      )
                  else:
                      lines.append(
                          line
                      )

              return (
                  "\n".join(lines).strip()
                  + "\n"
              )

          Path("README.md").write_text(
              clean(main),
              encoding="utf-8",
          )

          Path(
              "docs/readme/README_EN.md"
          ).write_text(
              clean(en),
              encoding="utf-8",
          )

          Path(
              "docs/readme/README_SK.md"
          ).write_text(
              clean(sk),
              encoding="utf-8",
          )

          Path(
              "docs/readme/README_CZ.md"
          ).write_text(
              clean(cz),
              encoding="utf-8",
          )

          print()
          print("========================================")
          print("Nuvio pages generated")
          print("========================================")
          print(f"Version:    {version}")
          print(f"IPA source: {ipa_origin}")
          print(f"OS:         {minimum_os_label}")
          print(f"Devices:    {supported_devices}")
          print("========================================")
          PY

      # ========================================================
      # Commit generated pages
      # ========================================================
      - name: Commit homepage and language guides
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git add docs/readme/README_EN.md
          git add docs/readme/README_SK.md
          git add docs/readme/README_CZ.md

          if git diff --cached --quiet; then
            echo "All pages are already current."
            exit 0
          fi

          git commit \
            -m "docs: refresh hybrid Nuvio SideStore pages"

          AUTH="$(
            printf 'x-access-token:%s' "$GH_TOKEN" \
              | base64 \
              | tr -d '\n'
          )"

          git \
            -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            push \
            origin \
            HEAD:cmp-rewrite

          echo "Homepage and language guides published."
