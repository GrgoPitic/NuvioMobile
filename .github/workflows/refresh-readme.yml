name: Refresh Nuvio Homepage

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Build Nuvio iOS SideStore"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: nuvio-homepage
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh GitHub homepage

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      # ========================================================
      # Clone without actions/checkout
      # ========================================================
      - name: Clone publishing branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git init .

          git remote add origin \
            "https://github.com/$GITHUB_REPOSITORY.git"

          AUTH="$(
            printf 'x-access-token:%s' "$GH_TOKEN" \
              | base64 \
              | tr -d '\n'
          )"

          git \
            -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch \
            --no-tags \
            --depth=1 \
            origin \
            refs/heads/cmp-rewrite

          git checkout \
            -B cmp-rewrite \
            FETCH_HEAD

          echo "Repository ready."

      # ========================================================
      # Current SideStore metadata
      # ========================================================
      - name: Read current Nuvio metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_FILE="sidestore/source.json"

          if [[ ! -f "$SOURCE_FILE" ]]; then
            echo "Missing $SOURCE_FILE" >&2
            exit 1
          fi

          VERSION="$(
            jq -r '
              .apps[0].versions[0].version
              // .apps[0].version
              // empty
            ' "$SOURCE_FILE"
          )"

          MIN_OS="$(
            jq -r '
              .apps[0].versions[0].minOSVersion
              // empty
            ' "$SOURCE_FILE"
          )"

          DOWNLOAD_URL="$(
            jq -r '
              .apps[0].versions[0].downloadURL
              // .apps[0].downloadURL
              // empty
            ' "$SOURCE_FILE"
          )"

          if [[ -z "$VERSION" || -z "$DOWNLOAD_URL" ]]; then
            echo "Current SideStore metadata is incomplete." >&2
            exit 1
          fi

          RELEASE_TAG="$(
            printf '%s\n' "$DOWNLOAD_URL" \
              | sed -E \
              's#.*\/releases\/download\/([^/]+)\/.*#\1#'
          )"

          OFFICIAL_TAG="${RELEASE_TAG#ios-}"

          [[ -n "$MIN_OS" ]] || MIN_OS="Unknown"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "min_os=$MIN_OS" >> "$GITHUB_OUTPUT"
          echo "download_url=$DOWNLOAD_URL" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "official_tag=$OFFICIAL_TAG" >> "$GITHUB_OUTPUT"

          echo "Version: $VERSION"
          echo "Release: $RELEASE_TAG"

      # ========================================================
      # Our mirrored / fallback GitHub Release
      # ========================================================
      - name: Read current iOS release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body // ""' \
            > /tmp/nuvio-ios-release.md

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '
              [
                .assets[]
                | select(.name | endswith(".ipa"))
                | .digest
                // empty
              ][0] // ""
            ' \
            > /tmp/nuvio-ipa-digest.txt

      # ========================================================
      # Nuvio logo
      # ========================================================
      - name: Read official Nuvio branding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_TAG: ${{ steps.metadata.outputs.official_tag }}
        run: |
          set -euo pipefail

          gh api \
            "repos/NuvioMedia/NuvioMobile/contents/README.md?ref=$OFFICIAL_TAG" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode \
            > /tmp/nuvio-official-readme.md

          export OFFICIAL_TAG

          python3 <<'PY'
          import html
          import os
          import re
          from pathlib import Path

          tag = os.environ["OFFICIAL_TAG"]

          text = Path(
              "/tmp/nuvio-official-readme.md"
          ).read_text(
              encoding="utf-8",
              errors="replace",
          )

          candidates = []

          candidates.extend(
              re.findall(
                  r'<img[^>]+src=["\']([^"\']+)["\']',
                  text,
                  flags=re.IGNORECASE,
              )
          )

          candidates.extend(
              re.findall(
                  r'!\[[^\]]*\]\(([^)\s]+)',
                  text,
              )
          )

          logo = ""

          for item in candidates:
              item = html.unescape(item.strip())

              if any(
                  token in item.lower()
                  for token in (
                      "logo",
                      "nuvio",
                      "banner",
                  )
              ):
                  logo = item
                  break

          if not logo and candidates:
              logo = html.unescape(
                  candidates[0].strip()
              )

          if not logo:
              logo_url = ""

          elif logo.startswith(
              ("https://", "http://")
          ):
              logo_url = logo

          elif logo.startswith("/"):
              logo_url = (
                  "https://raw.githubusercontent.com/"
                  "NuvioMedia/NuvioMobile/"
                  f"{tag}{logo}"
              )

          else:
              relative = logo

              while relative.startswith("./"):
                  relative = relative[2:]

              logo_url = (
                  "https://raw.githubusercontent.com/"
                  "NuvioMedia/NuvioMobile/"
                  f"{tag}/{relative}"
              )

          Path(
              "/tmp/nuvio-logo-url.txt"
          ).write_text(
              logo_url,
              encoding="utf-8",
          )

          print(
              f"Logo: {logo_url or 'not detected'}"
          )
          PY

      # ========================================================
      # Generate homepage + EN / SK / CZ
      # ========================================================
      - name: Generate polished multilingual pages
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          MIN_OS: ${{ steps.metadata.outputs.min_os }}
          DOWNLOAD_URL: ${{ steps.metadata.outputs.download_url }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          OFFICIAL_TAG: ${{ steps.metadata.outputs.official_tag }}
        run: |
          set -euo pipefail

          mkdir -p docs/readme

          python3 <<'PY'
          import json
          import os
          import re
          import urllib.parse
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]

          version = os.environ["VERSION"]
          min_os = os.environ["MIN_OS"]
          download_url = os.environ["DOWNLOAD_URL"]
          release_tag = os.environ["RELEASE_TAG"]
          official_tag = os.environ["OFFICIAL_TAG"]

          source = json.loads(
              Path(
                  "sidestore/source.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          app = source["apps"][0]
          versions = app.get("versions", [])

          if not versions:
              raise SystemExit(
                  "source.json contains no versions."
              )

          current = versions[0]

          changelog = (
              current.get(
                  "localizedDescription"
              )
              or app.get(
                  "versionDescription"
              )
              or f"Nuvio {version}"
          ).strip()

          release_body = Path(
              "/tmp/nuvio-ios-release.md"
          ).read_text(
              encoding="utf-8",
              errors="replace",
          )

          digest = Path(
              "/tmp/nuvio-ipa-digest.txt"
          ).read_text(
              encoding="utf-8",
              errors="replace",
          ).strip()

          logo_url = Path(
              "/tmp/nuvio-logo-url.txt"
          ).read_text(
              encoding="utf-8",
              errors="replace",
          ).strip()

          # ==================================================
          # Parse table values from GitHub Release
          # ==================================================

          def table_value(label):
              pattern = (
                  r"^\|\s*"
                  + re.escape(label)
                  + r"\s*\|\s*(.*?)\s*\|$"
              )

              match = re.search(
                  pattern,
                  release_body,
                  flags=(
                      re.MULTILINE
                      | re.IGNORECASE
                  ),
              )

              if not match:
                  return ""

              value = match.group(1)

              value = re.sub(
                  r"[*`]",
                  "",
                  value,
              )

              return value.strip()

          build_number = (
              table_value("Build")
              or "See release"
          )

          supported_devices = (
              table_value(
                  "Supported devices"
              )
              or "iPhone & iPad"
          )

          ipa_origin = (
              table_value("IPA source")
              or "Unknown"
          )

          source_reference = (
              table_value("Source reference")
              or "See release"
          )

          if digest.startswith("sha256:"):
              sha256 = digest.split(
                  ":",
                  1,
              )[1]
          else:
              sha256 = (
                  table_value("IPA SHA256")
                  or "See release"
              )

          # ==================================================
          # Source type
          # ==================================================

          is_official = (
              ipa_origin.lower()
              == "official nuvio ipa"
          )

          if is_official:
              origin_short = "OFFICIAL NUVIO"
              origin_color = "2ea44f"

              origin_en = (
                  "This version uses the official Nuvio FULL IPA. "
                  "The original IPA is downloaded from the matching "
                  "NuvioMedia release, verified, and mirrored unchanged "
                  "for SideStore distribution."
              )

              origin_sk = (
                  "Táto verzia používa oficiálnu FULL IPA aplikácie Nuvio. "
                  "Originálna IPA sa stiahne z príslušného vydania NuvioMedia, "
                  "overí sa a bez zmeny sa zrkadlí pre distribúciu cez SideStore."
              )

              origin_cz = (
                  "Tato verze používá oficiální FULL IPA aplikace Nuvio. "
                  "Originální IPA se stáhne z příslušného vydání NuvioMedia, "
                  "ověří se a beze změny se zrcadlí pro distribuci přes SideStore."
              )

          else:
              origin_short = "FALLBACK BUILD"
              origin_color = "e67e22"

              origin_en = (
                  "No usable official FULL IPA was available for this version. "
                  "This IPA was automatically compiled from the exact matching "
                  "official Nuvio source release using our fallback build."
              )

              origin_sk = (
                  "Pre túto verziu nebola dostupná použiteľná oficiálna FULL IPA. "
                  "IPA bola automaticky skompilovaná z presného zodpovedajúceho "
                  "oficiálneho zdrojového vydania Nuvio pomocou záložného buildu."
              )

              origin_cz = (
                  "Pro tuto verzi nebyla dostupná použitelná oficiální FULL IPA. "
                  "IPA byla automaticky sestavena z přesného odpovídajícího "
                  "oficiálního zdrojového vydání Nuvio pomocí záložního buildu."
              )

          # ==================================================
          # OS label
          # ==================================================

          lowered_devices = (
              supported_devices.lower()
          )

          if (
              "iphone" in lowered_devices
              and "ipad" in lowered_devices
          ):
              minimum_os_label = (
                  f"iOS / iPadOS {min_os}+"
              )

          elif "ipad" in lowered_devices:
              minimum_os_label = (
                  f"iPadOS {min_os}+"
              )

          elif "iphone" in lowered_devices:
              minimum_os_label = (
                  f"iOS {min_os}+"
              )

          else:
              minimum_os_label = (
                  f"{min_os}+"
              )

          # ==================================================
          # URLs
          # ==================================================

          source_url = (
              "https://raw.githubusercontent.com/"
              f"{repo}/cmp-rewrite/"
              "sidestore/source.json"
          )

          release_url = (
              f"https://github.com/{repo}/"
              f"releases/tag/{release_tag}"
          )

          official_url = (
              "https://github.com/"
              "NuvioMedia/NuvioMobile/"
              f"tree/{official_tag}"
          )

          official_repo = (
              "https://github.com/"
              "NuvioMedia/NuvioMobile"
          )

          # ==================================================
          # Badges
          # ==================================================

          def badge(
              label,
              message,
              color,
          ):
              label_q = urllib.parse.quote(
                  label,
                  safe="",
              )

              message_q = urllib.parse.quote(
                  message,
                  safe="",
              )

              return (
                  "https://img.shields.io/badge/"
                  f"{label_q}-{message_q}-{color}"
                  "?style=for-the-badge"
              )

          version_badge = badge(
              "VERSION",
              version,
              "2188ff",
          )

          os_badge = badge(
              "MINIMUM OS",
              minimum_os_label,
              "555555",
          )

          devices_badge = badge(
              "DEVICES",
              supported_devices,
              "2ea44f",
          )

          full_badge = badge(
              "DISTRIBUTION",
              "FULL",
              "6f42c1",
          )

          unsigned_badge = badge(
              "SIGNING",
              "UNSIGNED IPA",
              "e67e22",
          )

          automatic_badge = badge(
              "UPDATES",
              "AUTOMATIC",
              "00a4ef",
          )

          origin_badge = badge(
              "IPA SOURCE",
              origin_short,
              origin_color,
          )

          # ==================================================
          # Hero
          # ==================================================

          if logo_url:
              hero = (
                  '<p align="center">\n'
                  f'<img src="{logo_url}" '
                  'alt="Nuvio" width="460">\n'
                  '</p>'
              )
          else:
              hero = (
                  '<h1 align="center">'
                  'NUVIO'
                  '</h1>'
              )

          status_badges = (
              '<p align="center">\n'
              f'<img src="{version_badge}" alt="Version"> '
              f'<img src="{os_badge}" alt="Minimum OS"> '
              f'<img src="{devices_badge}" alt="Devices"><br>\n'
              f'<img src="{full_badge}" alt="Distribution"> '
              f'<img src="{unsigned_badge}" alt="Signing"> '
              f'<img src="{automatic_badge}" alt="Updates"><br>\n'
              f'<img src="{origin_badge}" alt="IPA source">\n'
              '</p>'
          )

          action_buttons = (
              '<p align="center">\n'
              f'<a href="{release_url}">'
              '<img src="https://img.shields.io/badge/'
              'GitHub_Release-VIEW_LATEST-2ea44f'
              '?style=for-the-badge&logo=github" '
              'alt="View latest release"></a> '
              f'<a href="{download_url}">'
              '<img src="https://img.shields.io/badge/'
              'IPA-DOWNLOAD_LATEST-2188ff'
              '?style=for-the-badge&logo=apple" '
              'alt="Download IPA"></a>\n'
              '</p>'
          )

          language_buttons = (
              '<p align="center">\n'

              '<a href="docs/readme/README_EN.md">'
              '<img src="https://img.shields.io/badge/'
              'ENGLISH-OPEN_GUIDE-2188ff'
              '?style=for-the-badge" '
              'alt="English"></a> '

              '<a href="docs/readme/README_SK.md">'
              '<img src="https://img.shields.io/badge/'
              'SLOVEN%C4%8CINA-OTVORI%C5%A4_N%C3%81VOD'
              '-2ea44f?style=for-the-badge" '
              'alt="Slovenčina"></a> '

              '<a href="docs/readme/README_CZ.md">'
              '<img src="https://img.shields.io/badge/'
              '%C4%8CE%C5%A0TINA-OTEV%C5%98%C3%8DT_N%C3%81VOD'
              '-e67e22?style=for-the-badge" '
              'alt="Čeština"></a>\n'

              '</p>'
          )

          sidestore_button = (
              '<p align="center">\n'
              f'<a href="{source_url}">'
              '<img src="https://img.shields.io/badge/'
              'SideStore-source.json-6f42c1'
              '?style=for-the-badge&logo=apple" '
              'alt="SideStore source"></a>\n'
              '</p>'
          )

          # ==================================================
          # MAIN
          # ==================================================

          main = f"""
          <!--
          AUTO-GENERATED FILE.
          Managed by .github/workflows/refresh-readme.yml
          -->

          {hero}

          <h2 align="center">
          Nuvio iOS / iPadOS SideStore Distribution
          </h2>

          <p align="center">
          Community-maintained SideStore source using the official Nuvio
          FULL IPA whenever available, with an automatic source-build
          fallback as a safety net.
          </p>

          {status_badges}

          > [!IMPORTANT]
          > **This is an unofficial SideStore distribution channel.**
          >
          > This repository is not affiliated with or endorsed by NuvioMedia.
          > It prefers the official Nuvio FULL IPA and only compiles a fallback
          > IPA from the matching official source when necessary.

          <h2 align="center">📦 IPA Source</h2>

          <p align="center">
          <strong>{origin_short}</strong>
          </p>

          <p align="center">
          {origin_en}
          </p>

          <h2 align="center">🚀 Latest Release</h2>

          <p align="center">
          <strong>Nuvio {version}</strong><br>
          Build {build_number} · {minimum_os_label} · {supported_devices}<br>
          FULL distribution · Unsigned IPA
          </p>

          {action_buttons}

          <h2 align="center">🌍 Choose your language</h2>

          <p align="center">
          Open the complete guide in your preferred language.
          </p>

          {language_buttons}

          <p align="center">
          🇬🇧 English &nbsp;&nbsp; • &nbsp;&nbsp;
          🇸🇰 Slovenčina &nbsp;&nbsp; • &nbsp;&nbsp;
          🇨🇿 Čeština
          </p>

          <h2 align="center">🔗 SideStore Automatic Updates</h2>

          <p align="center">
          Add this source once and future versions can appear
          automatically in SideStore.
          </p>

          ```text
          {source_url}
          ```

          {sidestore_button}

          <p align="center">
          <strong>SideStore → Sources → Add Source</strong>
          </p>

          <h2 align="center">✨ What's New in {version}</h2>

          {changelog}

          ---

          <h2 align="center">🔎 Verification</h2>

          <details>
          <summary><strong>Show technical information</strong></summary>

          ```text
          Official repository: NuvioMedia/NuvioMobile
          Official tag:        {official_tag}
          Version:             {version}
          Build:               {build_number}
          Minimum OS:          {minimum_os_label}
          Supported devices:   {supported_devices}
          Distribution:        FULL
          Signing:             Unsigned IPA
          IPA source:          {ipa_origin}
          Source reference:    {source_reference}
          IPA SHA256:          {sha256}
          ```

          </details>

          ---

          <h2 align="center">❤️ Official Nuvio Project</h2>

          <p align="center">
          Original Nuvio project, source code and official releases:<br><br>

          <strong>
          <a href="{official_repo}">
          NuvioMedia/NuvioMobile
          </a>
          </strong><br><br>

          Source version corresponding to this release:
          <a href="{official_url}">{official_tag}</a>
          </p>

          <p align="center">
          💜 Thank you for supporting Nuvio and the community.
          </p>
          """

          # ==================================================
          # EN
          # ==================================================

          en = f"""
          {hero}

          <h1 align="center">
          🇬🇧 Nuvio iOS / iPadOS — English Guide
          </h1>

          <p align="center">
          <a href="../../README.md">← Back to main page</a>
          </p>

          {status_badges}

          > [!IMPORTANT]
          > This is an **unofficial community SideStore distribution**.
          > It is not an official NuvioMedia distribution channel.

          <h2 align="center">📦 IPA Source</h2>

          <p align="center">
          <strong>{origin_short}</strong><br><br>
          {origin_en}
          </p>

          <h2 align="center">📱 Current Version</h2>

          <p align="center">
          <strong>Nuvio {version}</strong><br>
          Build {build_number}<br>
          {minimum_os_label}<br>
          {supported_devices}<br>
          FULL · Unsigned IPA
          </p>

          {action_buttons}

          <h2 align="center">🔗 SideStore Automatic Updates</h2>

          ```text
          {source_url}
          ```

          {sidestore_button}

          <p align="center">
          SideStore → Sources → Add Source
          </p>

          <h2 align="center">✨ What's New in {version}</h2>

          {changelog}

          <h2 align="center">ℹ️ How this distribution works</h2>

          - Official FULL IPA is always preferred.
          - Official IPA is verified before publishing.
          - Official IPA bytes are mirrored unchanged.
          - If no usable official IPA exists, the fallback build activates.
          - Fallback builds use the exact matching official Nuvio source.
          - SideStore source URL remains the same in both cases.

          <p align="center">
          <a href="../../README.md">← Back to main page</a>
          </p>
          """

          # ==================================================
          # SK
          # ==================================================

          sk = f"""
          {hero}

          <h1 align="center">
          🇸🇰 Nuvio pre iOS / iPadOS — Slovenský návod
          </h1>

          <p align="center">
          <a href="../../README.md">← Späť na hlavnú stránku</a>
          </p>

          {status_badges}

          > [!IMPORTANT]
          > Toto je **neoficiálny komunitný distribučný kanál pre SideStore**.
          > Nejde o oficiálny distribučný kanál spoločnosti NuvioMedia.

          <h2 align="center">📦 Pôvod IPA</h2>

          <p align="center">
          <strong>{origin_short}</strong><br><br>
          {origin_sk}
          </p>

          <h2 align="center">📱 Aktuálna verzia</h2>

          <p align="center">
          <strong>Nuvio {version}</strong><br>
          Build {build_number}<br>
          {minimum_os_label}<br>
          {supported_devices}<br>
          FULL · Nepodpísaná IPA
          </p>

          {action_buttons}

          <h2 align="center">🔗 Automatické aktualizácie cez SideStore</h2>

          <p align="center">
          V SideStore otvor <strong>Sources → Add Source</strong>
          a vlož:
          </p>

          ```text
          {source_url}
          ```

          {sidestore_button}

          <h2 align="center">✨ Čo je nové vo verzii {version}</h2>

          {changelog}

          <h2 align="center">ℹ️ Ako distribúcia funguje</h2>

          - Vždy sa preferuje oficiálna FULL IPA.
          - Oficiálna IPA sa pred publikovaním overí.
          - Dáta oficiálnej IPA sa pri zrkadlení nemenia.
          - Ak oficiálna IPA nie je použiteľná, aktivuje sa záložný build.
          - Záložný build používa presný zodpovedajúci oficiálny zdroj Nuvio.
          - SideStore URL zostáva v oboch prípadoch rovnaká.

          <h2 align="center">🔎 Overenie</h2>

          <details>
          <summary><strong>Zobraziť technické údaje</strong></summary>

          ```text
          Oficiálny tag:     {official_tag}
          IPA source:        {ipa_origin}
          Source reference:  {source_reference}
          IPA SHA256:        {sha256}
          ```

          </details>

          <p align="center">
          <a href="../../README.md">← Späť na hlavnú stránku</a>
          </p>
          """

          # ==================================================
          # CZ
          # ==================================================

          cz = f"""
          {hero}

          <h1 align="center">
          🇨🇿 Nuvio pro iOS / iPadOS — Český návod
          </h1>

          <p align="center">
          <a href="../../README.md">← Zpět na hlavní stránku</a>
          </p>

          {status_badges}

          > [!IMPORTANT]
          > Toto je **neoficiální komunitní distribuční kanál pro SideStore**.
          > Nejde o oficiální distribuční kanál společnosti NuvioMedia.

