name: Refresh Nuvio Homepage

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Build Nuvio iOS SideStore"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: nuvio-homepage
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh GitHub homepage

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      # ========================================================
      # Checkout our publishing branch
      # ========================================================
      - name: Checkout publishing branch
        uses: actions/checkout@v6
        with:
          ref: cmp-rewrite
          fetch-depth: 1

      # ========================================================
      # Read current version directly from SideStore source
      # ========================================================
      - name: Read current Nuvio iOS metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_FILE="sidestore/source.json"

          if [[ ! -f "$SOURCE_FILE" ]]; then
            echo "Missing $SOURCE_FILE" >&2
            exit 1
          fi

          VERSION="$(
            jq -r '
              .apps[0].versions[0].version
              // .apps[0].version
              // empty
            ' "$SOURCE_FILE"
          )"

          MIN_OS="$(
            jq -r '
              .apps[0].versions[0].minOSVersion
              // empty
            ' "$SOURCE_FILE"
          )"

          DOWNLOAD_URL="$(
            jq -r '
              .apps[0].versions[0].downloadURL
              // .apps[0].downloadURL
              // empty
            ' "$SOURCE_FILE"
          )"

          if [[ -z "$VERSION" ]]; then
            echo "Could not determine current version." >&2
            exit 1
          fi

          if [[ -z "$DOWNLOAD_URL" ]]; then
            echo "Could not determine current IPA URL." >&2
            exit 1
          fi

          RELEASE_TAG="$(
            printf '%s\n' "$DOWNLOAD_URL" \
              | sed -E \
              's#.*\/releases\/download\/([^/]+)\/.*#\1#'
          )"

          OFFICIAL_TAG="${RELEASE_TAG#ios-}"

          if [[ -z "$MIN_OS" ]]; then
            MIN_OS="Unknown"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "min_os=$MIN_OS" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "official_tag=$OFFICIAL_TAG" >> "$GITHUB_OUTPUT"

          echo "Version:      $VERSION"
          echo "Minimum OS:   $MIN_OS"
          echo "Release tag:  $RELEASE_TAG"
          echo "Official tag: $OFFICIAL_TAG"

      # ========================================================
      # Read our generated GitHub Release
      # ========================================================
      - name: Read current iOS release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          set -euo pipefail

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq '.body // ""' \
            > /tmp/nuvio-ios-release.md

          gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            --jq '
              [
                .assets[]
                | select(.name | endswith(".ipa"))
                | .digest
                // empty
              ][0] // ""
            ' \
            > /tmp/nuvio-ipa-digest.txt

      # ========================================================
      # Get official Nuvio logo from matching upstream release
      # We do NOT copy the official README to our homepage.
      # ========================================================
      - name: Read official Nuvio branding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OFFICIAL_TAG: ${{ steps.metadata.outputs.official_tag }}
        run: |
          set -euo pipefail

          gh api \
            "repos/NuvioMedia/NuvioMobile/contents/README.md?ref=$OFFICIAL_TAG" \
            --jq '.content' \
            | tr -d '\n' \
            | base64 --decode \
            > /tmp/nuvio-official-readme.md

          export OFFICIAL_TAG

          python3 <<'PY'
          import html
          import os
          import re
          from pathlib import Path

          tag = os.environ["OFFICIAL_TAG"]

          text = Path(
              "/tmp/nuvio-official-readme.md"
          ).read_text(
              encoding="utf-8",
              errors="replace",
          )

          candidates = []

          # HTML images
          candidates.extend(
              re.findall(
                  r'<img[^>]+src=["\']([^"\']+)["\']',
                  text,
                  flags=re.IGNORECASE,
              )
          )

          # Markdown images
          candidates.extend(
              re.findall(
                  r'!\[[^\]]*\]\(([^)\s]+)',
                  text,
              )
          )

          logo = ""

          for candidate in candidates:
              candidate = html.unescape(
                  candidate.strip()
              )

              lowered = candidate.lower()

              if (
                  "logo" in lowered
                  or "nuvio" in lowered
                  or "banner" in lowered
              ):
                  logo = candidate
                  break

          if not logo and candidates:
              logo = html.unescape(
                  candidates[0].strip()
              )

          if logo:
              if logo.startswith(
                  ("http://", "https://")
              ):
                  logo_url = logo

              elif logo.startswith("/"):
                  logo_url = (
                      "https://raw.githubusercontent.com/"
                      "NuvioMedia/NuvioMobile/"
                      f"{tag}{logo}"
                  )

              else:
                  relative = logo

                  while relative.startswith("./"):
                      relative = relative[2:]

                  logo_url = (
                      "https://raw.githubusercontent.com/"
                      "NuvioMedia/NuvioMobile/"
                      f"{tag}/{relative}"
                  )

          else:
              logo_url = ""

          Path(
              "/tmp/nuvio-logo-url.txt"
          ).write_text(
              logo_url,
              encoding="utf-8",
          )

          print(
              f"Nuvio logo URL: {logo_url or 'not detected'}"
          )
          PY

      # ========================================================
      # Generate completely custom homepage
      # ========================================================
      - name: Generate custom Nuvio homepage
        shell: bash
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
          MIN_OS: ${{ steps.metadata.outputs.min_os }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          OFFICIAL_TAG: ${{ steps.metadata.outputs.official_tag }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import re
          import urllib.parse
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]

          version = os.environ["VERSION"]
          min_os = os.environ["MIN_OS"]
          release_tag = os.environ["RELEASE_TAG"]
          official_tag = os.environ["OFFICIAL_TAG"]

          source = json.loads(
              Path(
                  "sidestore/source.json"
              ).read_text(
                  encoding="utf-8"
              )
          )

          app = source["apps"][0]

          versions = app.get(
              "versions",
              []
          )

          if not versions:
              raise SystemExit(
                  "source.json contains no versions."
              )

          current = versions[0]

          changelog = (
              current.get(
                  "localizedDescription"
              )
              or app.get(
                  "versionDescription"
              )
              or f"Nuvio {version}"
          ).strip()

          release_body = Path(
              "/tmp/nuvio-ios-release.md"
          ).read_text(
              encoding="utf-8",
              errors="replace",
          )

          digest = Path(
              "/tmp/nuvio-ipa-digest.txt"
          ).read_text(
              encoding="utf-8",
              errors="replace",
          ).strip()

          logo_url = Path(
              "/tmp/nuvio-logo-url.txt"
          ).read_text(
              encoding="utf-8",
              errors="replace",
          ).strip()

          # --------------------------------------------------
          # Helpers
          # --------------------------------------------------

          def table_value(label):
              pattern = (
                  r"^\|\s*"
                  + re.escape(label)
                  + r"\s*\|\s*(.*?)\s*\|$"
              )

              match = re.search(
                  pattern,
                  release_body,
                  flags=(
                      re.MULTILINE
                      | re.IGNORECASE
                  ),
              )

              if not match:
                  return ""

              value = match.group(1)

              value = re.sub(
                  r"[*`]",
                  "",
                  value,
              )

              return value.strip()

          build_number = (
              table_value("Build")
              or "See release"
          )

          supported_devices = (
              table_value(
                  "Supported devices"
              )
              or "See release"
          )

          official_commit = (
              table_value(
                  "Official source commit"
              )
              or "See release"
          )

          if digest.startswith("sha256:"):
              sha256 = digest.split(
                  ":",
                  1,
              )[1]

          else:
              sha256 = (
                  table_value("IPA SHA256")
                  or "See release"
              )

          # --------------------------------------------------
          # Human-readable OS label
          # --------------------------------------------------

          lowered_devices = (
              supported_devices.lower()
          )

          if (
              "iphone" in lowered_devices
              and "ipad" in lowered_devices
          ):
              minimum_os_label = (
                  f"iOS / iPadOS {min_os}+"
              )

          elif "ipad" in lowered_devices:
              minimum_os_label = (
                  f"iPadOS {min_os}+"
              )

          elif "iphone" in lowered_devices:
              minimum_os_label = (
                  f"iOS {min_os}+"
              )

          else:
              minimum_os_label = (
                  f"{min_os}+"
              )

          source_url = (
              "https://raw.githubusercontent.com/"
              f"{repo}/cmp-rewrite/"
              "sidestore/source.json"
          )

          release_url = (
              f"https://github.com/{repo}/"
              f"releases/tag/{release_tag}"
          )

          official_url = (
              "https://github.com/"
              "NuvioMedia/NuvioMobile/"
              f"tree/{official_tag}"
          )

          official_repo = (
              "https://github.com/"
              "NuvioMedia/NuvioMobile"
          )

          # --------------------------------------------------
          # Header / logo
          # --------------------------------------------------

          if logo_url:
              hero = f"""
          <p align="center">
            <img
              src="{logo_url}"
              alt="Nuvio"
              width="500"
            />
          </p>
          """

          else:
              hero = """
          <h1 align="center">NUVIO</h1>
          """

          # --------------------------------------------------
          # Badges
          # --------------------------------------------------

          def badge(label, message, color):
              label_q = urllib.parse.quote(
                  label,
                  safe="",
              )

              message_q = urllib.parse.quote(
                  message,
                  safe="",
              )

              return (
                  "https://img.shields.io/badge/"
                  f"{label_q}-{message_q}-{color}"
                  "?style=for-the-badge"
              )

          version_badge = badge(
              "Version",
              version,
              "2188ff",
          )

          os_badge = badge(
              "Minimum OS",
              minimum_os_label,
              "555555",
          )

          full_badge = badge(
              "Distribution",
              "FULL",
              "6f42c1",
          )

          unsigned_badge = badge(
              "Signing",
              "Unsigned IPA",
              "e67e22",
          )

          # --------------------------------------------------
          # Homepage
          # --------------------------------------------------

          page = f"""
          <!--
          AUTO-GENERATED FILE.
          Managed by .github/workflows/refresh-readme.yml
          Current Nuvio iOS release: {version}
          -->

          {hero}

          <p align="center">
            <strong>
              🎬 Unofficial clean IPA build · Community-maintained iOS / iPadOS package
            </strong>
          </p>

          <p align="center">
            <img src="{version_badge}" alt="Version {version}" />
            <img src="{os_badge}" alt="Minimum OS {minimum_os_label}" />
            <img src="{full_badge}" alt="FULL distribution" />
            <img src="{unsigned_badge}" alt="Unsigned IPA" />
          </p>

          > [!IMPORTANT]
          > **This is an unofficial iOS / iPadOS distribution of Nuvio.**
          >
          > This repository is not affiliated with or endorsed by NuvioMedia.
          > The application source code is **not modified**.
          > The IPA is automatically built from the corresponding official
          > `NuvioMedia/NuvioMobile` release source using only the build-time
          > configuration required for the **FULL** distribution.

          ## 📱 Current build

          | Information | Value |
          | --- | --- |
          | **Latest version** | **{version}** |
          | **Build** | **{build_number}** |
          | **Minimum OS** | **{minimum_os_label}** |
          | **Supported devices** | **{supported_devices}** |
          | **Distribution** | **FULL** |
          | **Signing** | **Unsigned IPA** |
          | **Official source tag** | [`{official_tag}`]({official_url}) |
          | **Official source commit** | `{official_commit}` |
          | **IPA SHA256** | `{sha256}` |
          | **Latest release** | [Nuvio iOS {version}]({release_url}) |

          <table>
            <tr>
              <td width="33%" valign="top">
                <strong>🇬🇧 English</strong>
                <br><br>
                Information and SideStore instructions
                for English-speaking users.
                <br><br>
                <a href="#english">
                  Go to English section →
                </a>
              </td>
              <td width="33%" valign="top">
                <strong>🇨🇿 Čeština</strong>
                <br><br>
                Informace a pokyny pro SideStore
                pro české uživatele.
                <br><br>
                <a href="#cestina">
                  Přejít na českou sekci →
                </a>
              </td>
              <td width="33%" valign="top">
                <strong>🇸🇰 Slovenčina</strong>
                <br><br>
                Informácie a pokyny pre SideStore
                pre slovenských používateľov.
                <br><br>
                <a href="#slovencina">
                  Prejsť na slovenskú sekciu →
                </a>
              </td>
            </tr>
          </table>

          ## 🔗 SideStore Update (`source.json`)

          Add this source to SideStore to receive automatic updates:

          ```text
          {source_url}
          ```

          **SideStore → Sources → Add Source → paste the URL above**

          Once added, new builds can appear automatically after a new
          official Nuvio release is detected and successfully compiled.

          ## ✨ What's new in {version}

          {changelog}

          ---

          <a id="english"></a>

          <details>
          <summary><strong>🇬🇧 English</strong></summary>

          ### Unofficial Nuvio iOS / iPadOS build

          This repository provides an **unofficial clean unsigned IPA**
          of Nuvio.

          - Current version: **{version}**
          - Minimum OS: **{minimum_os_label}**
          - Supported devices: **{supported_devices}**
          - Distribution: **FULL**
          - Signing: **Unsigned IPA**
          - Application source code: **not modified**

          ### Automatic SideStore updates

          Add this URL in:

          **SideStore → Sources → Add Source**

          ```text
          {source_url}
          ```

          This project is community-maintained and is not an official
          NuvioMedia distribution.

          </details>

          <a id="cestina"></a>

          <details>
          <summary><strong>🇨🇿 Čeština</strong></summary>

          ### Neoficiální Nuvio build pro iOS / iPadOS

          Tento repozitář poskytuje **neoficiální čistý nepodepsaný IPA**
          aplikace Nuvio.

          - Aktuální verze: **{version}**
          - Minimální systém: **{minimum_os_label}**
          - Podporovaná zařízení: **{supported_devices}**
          - Distribuce: **FULL**
          - Podpis: **Unsigned IPA**
          - Zdrojový kód aplikace: **není upravován**

          ### Automatické aktualizace SideStore

          V SideStore otevři:

          **Sources → Add Source**

          a vlož:

          ```text
          {source_url}
          ```

          Tento projekt je komunitní a nejde o oficiální distribuci
          společnosti NuvioMedia.

          </details>

          <a id="slovencina"></a>

          <details>
          <summary><strong>🇸🇰 Slovenčina</strong></summary>

          ### Neoficiálny Nuvio build pre iOS / iPadOS

          Tento repozitár poskytuje **neoficiálny čistý nepodpísaný IPA**
          aplikácie Nuvio.

          - Aktuálna verzia: **{version}**
          - Minimálny systém: **{minimum_os_label}**
          - Podporované zariadenia: **{supported_devices}**
          - Distribúcia: **FULL**
          - Podpis: **Unsigned IPA**
          - Zdrojový kód aplikácie: **nie je upravovaný**

          ### Automatické aktualizácie SideStore

          V SideStore otvor:

          **Sources → Add Source**

          a vlož:

          ```text
          {source_url}
          ```

          Tento projekt je komunitný a nejde o oficiálnu distribúciu
          spoločnosti NuvioMedia.

          </details>

          ---

          ## 🔍 Build provenance

          ```text
          Official repository: NuvioMedia/NuvioMobile
          Official tag:        {official_tag}
          Official commit:     {official_commit}
          Version:             {version}
          Build:               {build_number}
          Minimum OS:          {minimum_os_label}
          Supported devices:   {supported_devices}
          Distribution:        FULL
          Signing:             Unsigned IPA
          IPA SHA256:          {sha256}
          ```

          ---

          ## Official Nuvio project

          This repository distributes community-built unsigned iOS / iPadOS
          packages of Nuvio. For the original project, full documentation,
          source code and official project information visit:

          **[NuvioMedia/NuvioMobile]({official_repo})**

          Official source used for this build:

          **[{official_tag}]({official_url})**

          💜 Thank you for supporting Nuvio and the community.
          """

          cleaned = []

          for line in page.splitlines():
              if line.startswith("          "):
                  cleaned.append(
                      line[10:]
                  )
              else:
                  cleaned.append(line)

          output = (
              "\n".join(cleaned).strip()
              + "\n"
          )

          Path("README.md").write_text(
              output,
              encoding="utf-8",
          )

          print()
          print("========================================")
          print("Custom Nuvio homepage generated")
          print("========================================")
          print(f"Version: {version}")
          print(f"Minimum OS: {minimum_os_label}")
          print(f"Devices: {supported_devices}")
          print(f"Release: {release_tag}")
          print("========================================")
          PY

      # ========================================================
      # Commit README
      # ========================================================
      - name: Commit homepage
        shell: bash
        run: |
          set -euo pipefail

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "README is already current."
            exit 0
          fi

          git commit \
            -m "docs: refresh custom Nuvio SideStore homepage"

          git push origin HEAD:cmp-rewrite

          echo "Homepage published."
