name: Build Nuvio iOS SideStore

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Build again even if this iOS release already exists"
        required: false
        type: boolean
        default: false

  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: nuvio-ios-sidestore
  cancel-in-progress: false

jobs:
  check:
    name: Check latest Nuvio release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.detect.outputs.tag }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
      should_build: ${{ steps.detect.outputs.should_build }}

    steps:
      - name: Check latest official Nuvio release
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail

          TAG="$(gh api repos/NuvioMedia/NuvioMobile/releases/latest --jq '.tag_name')"
          RELEASE_TAG="ios-$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          echo "Latest official Nuvio release: $TAG"
          echo "Our iOS release tag: $RELEASE_TAG"

          if [[ "${FORCE_BUILD:-false}" == "true" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Force build requested."
          elif gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists. Nothing to build."
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New official Nuvio release detected: $TAG"
          fi

  build:
    name: Build Nuvio iOS
    needs: check
    if: needs.check.outputs.should_build == 'true'

    runs-on: macos-26
    timeout-minutes: 120

    env:
      NUVIO_IOS_DISTRIBUTION: full

      NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
      NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
      NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}

      GRADLE_OPTS: -Xmx1536m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m
      KOTLIN_DAEMON_JVMARGS: -Xmx3072m

    steps:
      - name: Checkout official Nuvio release
        uses: actions/checkout@v6
        with:
          repository: NuvioMedia/NuvioMobile
          ref: ${{ needs.check.outputs.tag }}
          fetch-depth: 1

      - name: Initialize MPVKit submodule
        shell: bash
        run: git submodule update --init MPVKit

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show build environment
        shell: bash
        run: |
          java -version
          ./gradlew --version
          xcodebuild -version
          echo "Official release: ${{ needs.check.outputs.tag }}"

      - name: Build Nuvio Engine Apple XCFramework
        shell: bash
        run: |
          set -euo pipefail

          ENGINE_DIR="$GITHUB_WORKSPACE/../nuvio-engine"

          rm -rf "$ENGINE_DIR"

          git clone --depth 1 \
            https://github.com/NuvioMedia/nuvio-engine.git \
            "$ENGINE_DIR"

          cd "$ENGINE_DIR"

          NUVIO_BUILD_JOBS=2 ./scripts/build-apple-xcframework.sh

      - name: Build unsigned Nuvio Release
        shell: bash
        run: |
          set -euo pipefail

          touch local.properties

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/NuvioDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        id: package
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/NuvioDerivedData/Build/Products/Release-iphoneos/Nuvio.app"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "Nuvio.app was not found at: $APP_PATH" >&2
            exit 1
          fi

          INFO_PLIST="$APP_PATH/Info.plist"

          VERSION="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleShortVersionString' \
            "$INFO_PLIST")"

          BUILD_VERSION="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleVersion' \
            "$INFO_PLIST")"

          BUNDLE_ID="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleIdentifier' \
            "$INFO_PLIST")"

          MIN_OS="$(/usr/libexec/PlistBuddy \
            -c 'Print :MinimumOSVersion' \
            "$INFO_PLIST")"

          IPA_NAME="Nuvio-${VERSION}.ipa"
          PACKAGE_DIR="$RUNNER_TEMP/nuvio-ipa"

          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"

          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/Nuvio.app"

          (
            cd "$PACKAGE_DIR"
            /usr/bin/zip -qry \
              "$GITHUB_WORKSPACE/$IPA_NAME" \
              Payload
          )

          IPA_SIZE="$(stat -f '%z' "$GITHUB_WORKSPACE/$IPA_NAME")"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "min_os=$MIN_OS" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_size=$IPA_SIZE" >> "$GITHUB_OUTPUT"

          echo "Created $IPA_NAME"
          echo "Version: $VERSION"
          echo "Build: $BUILD_VERSION"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Minimum iOS: $MIN_OS"

          ls -lh "$GITHUB_WORKSPACE/$IPA_NAME"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v6
        with:
          name: Nuvio-${{ steps.package.outputs.version }}-SideStore
          path: ${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 7

      - name: Prepare official release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/official-release-notes.md"

          gh api \
            "repos/NuvioMedia/NuvioMobile/releases/tags/$UPSTREAM_TAG" \
            --jq '.body // ""' \
            > "$NOTES_FILE"

          # Ak oficialny release nema textovy changelog,
          # vytvorime zoznam commitov medzi poslednymi releasmi.
          if [[ ! -s "$NOTES_FILE" ]]; then
            PREVIOUS_TAG="$(
              gh api \
                "repos/NuvioMedia/NuvioMobile/releases?per_page=2" \
                --jq '.[1].tag_name // ""'
            )"

            if [[ -n "$PREVIOUS_TAG" ]]; then
              {
                echo "Changes from $PREVIOUS_TAG to $UPSTREAM_TAG:"
                echo

                gh api \
                  "repos/NuvioMedia/NuvioMobile/compare/$PREVIOUS_TAG...$UPSTREAM_TAG" \
                  --jq '.commits[] | "- " + (.commit.message | split("\n")[0])'
              } > "$NOTES_FILE"
            fi
          fi

          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "Nuvio $UPSTREAM_TAG" > "$NOTES_FILE"
          fi

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

          echo
          echo "Official changelog:"
          cat "$NOTES_FILE"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}

          VERSION: ${{ steps.package.outputs.version }}
          IPA_NAME: ${{ steps.package.outputs.ipa_name }}

          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail

          RELEASE_NOTES="$RUNNER_TEMP/ios-release-notes.md"

          {
            echo "Automaticky vytvorený unsigned iOS FULL build pre SideStore."
            echo
            echo "Zdroj: NuvioMedia/NuvioMobile"
            echo
            echo "Oficiálny release: \`$UPSTREAM_TAG\`"
            echo
            echo
            echo "## Zmeny v oficiálnom Nuvio"
            echo
            cat "$NOTES_FILE"
          } > "$RELEASE_NOTES"

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nuvio iOS $VERSION" \
              --notes-file "$RELEASE_NOTES"

            gh release upload "$RELEASE_TAG" \
              "$GITHUB_WORKSPACE/$IPA_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else

            gh release create "$RELEASE_TAG" \
              "$GITHUB_WORKSPACE/$IPA_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nuvio iOS $VERSION" \
              --notes-file "$RELEASE_NOTES"
          fi

      - name: Checkout SideStore publishing branch
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: cmp-rewrite
          path: _publish
          token: ${{ github.token }}

      - name: Update SideStore source.json
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}

          VERSION: ${{ steps.package.outputs.version }}
          BUNDLE_ID: ${{ steps.package.outputs.bundle_id }}
          MIN_OS: ${{ steps.package.outputs.min_os }}

          IPA_NAME: ${{ steps.package.outputs.ipa_name }}
          IPA_SIZE: ${{ steps.package.outputs.ipa_size }}

          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail

          SOURCE_DIR="$GITHUB_WORKSPACE/_publish/sidestore"
          SOURCE_FILE="$SOURCE_DIR/source.json"

          mkdir -p "$SOURCE_DIR"

          PUBLISHED_AT="$(
            gh api \
              "repos/NuvioMedia/NuvioMobile/releases/tags/$UPSTREAM_TAG" \
              --jq '.published_at'
          )"

          export SOURCE_FILE
          export PUBLISHED_AT

          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source_file = Path(os.environ["SOURCE_FILE"])
          notes_file = Path(os.environ["NOTES_FILE"])

          repo = os.environ["GITHUB_REPOSITORY"]

          version = os.environ["VERSION"]
          bundle_id = os.environ["BUNDLE_ID"]
          min_os = os.environ["MIN_OS"]

          release_tag = os.environ["RELEASE_TAG"]
          ipa_name = os.environ["IPA_NAME"]
          ipa_size = int(os.environ["IPA_SIZE"])

          published_at = os.environ["PUBLISHED_AT"].strip()

          notes = notes_file.read_text(
              encoding="utf-8"
          ).strip()

          if not notes:
              notes = f"Nuvio {version}"

          download_url = (
              f"https://github.com/{repo}/releases/download/"
              f"{release_tag}/{ipa_name}"
          )

          source_url = (
              f"https://raw.githubusercontent.com/{repo}/"
              "cmp-rewrite/sidestore/source.json"
          )

          icon_url = "https://github.com/NuvioMedia.png?size=512"

          # --------------------------------------------------
          # Zachovanie historie starsich verzii.
          # Zaroven vycistime polia, ktore nie su sucastou
          # aktualnej SideStore Version schemy.
          # --------------------------------------------------

          old_versions = []

          if source_file.exists():
              try:
                  existing = json.loads(
                      source_file.read_text(encoding="utf-8")
                  )

                  for old_app in existing.get("apps", []):
                      if old_app.get("bundleIdentifier") == bundle_id:
                          old_versions = old_app.get("versions", [])
                          break

              except Exception as exc:
                  print(f"Existing source ignored: {exc}")

          allowed_version_keys = {
              "version",
              "date",
              "localizedDescription",
              "downloadURL",
              "size",
              "minOSVersion",
              "maxOSVersion",
          }

          cleaned_versions = []

          for item in old_versions:
              if not isinstance(item, dict):
                  continue

              cleaned = {
                  key: value
                  for key, value in item.items()
                  if key in allowed_version_keys
              }

              if not all(
                  key in cleaned
                  for key in (
                      "version",
                      "date",
                      "downloadURL",
                      "size",
                  )
              ):
                  continue

              # Aktualnu verziu pridame nanovo.
              if str(cleaned["version"]) == version:
                  continue

              cleaned_versions.append(cleaned)

          latest_version = {
              "version": version,
              "date": published_at,
              "localizedDescription": notes,
              "downloadURL": download_url,
              "size": ipa_size,
              "minOSVersion": min_os,
          }

          # SideStore berie prvu kompatibilnu polozku
          # ako najnovsiu verziu.
          versions = [
              latest_version,
              *cleaned_versions,
          ]

          # --------------------------------------------------
          # Kratky changelog pre News.
          # Plny changelog ostava vo versionDescription
          # aj versions[].localizedDescription.
          # --------------------------------------------------

          plain = re.sub(
              r"[#*_`>\[\]\(\)]",
              "",
              notes,
          )

          plain = " ".join(plain.split())

          caption = plain[:280].strip()

          if len(plain) > 280:
              caption += "…"

          # --------------------------------------------------
          # App objekt:
          #
          # - versionDescription = kompatibilne zobrazenie
          #   noviniek v najnovsej verzii
          #
          # - versions[].localizedDescription = AltSource v2
          # --------------------------------------------------

          app = {
              "name": "Nuvio",
              "bundleIdentifier": bundle_id,
              "developerName": "NuvioMedia",
              "subtitle": "Nuvio Mobile for iOS",

              "localizedDescription": (
                  "Nuvio Mobile FULL build pre iOS a SideStore, "
                  "automaticky zostavený z oficiálnych "
                  "NuvioMedia/NuvioMobile releaseov."
              ),

              "iconURL": icon_url,

              # Backward-compatible SideStore metadata
              "version": version,
              "versionDate": published_at,
              "versionDescription": notes,
              "downloadURL": download_url,
              "size": ipa_size,

              # Moderny AltSource v2 format
              "versions": versions,
          }

          # --------------------------------------------------
          # News - pri kazdej verzii bude v SideStore vidno,
          # ze vysla nova verzia a kratky prehlad zmien.
          # --------------------------------------------------

          news = [
              {
                  "title": f"Nuvio {version}",
                  "identifier": f"nuvio-ios-{version}",
                  "caption": caption or f"Nuvio {version}",
                  "date": published_at,
                  "appID": bundle_id,
              }
          ]

          # --------------------------------------------------
          # Cisty SideStore Source objekt.
          # Identifier uz nemenit.
          # --------------------------------------------------

          source = {
              "name": "Nuvio iOS SideStore",
              "identifier": "com.grgopitic.nuvio.sidestore",
              "sourceURL": source_url,
              "apps": [app],
              "news": news,
          }

          source_file.write_text(
              json.dumps(
                  source,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print()
          print("========================================")
          print("SideStore source updated")
          print("========================================")
          print(f"Version: {version}")
          print(f"Bundle ID: {bundle_id}")
          print(f"Minimum iOS: {min_os}")
          print(f"Download URL: {download_url}")
          print(f"Versions stored: {len(versions)}")
          print("========================================")
          PY

          python3 -m json.tool "$SOURCE_FILE" >/dev/null

          echo "source.json is valid JSON."

      - name: Commit SideStore source
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/_publish"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add sidestore/source.json

          if git diff --cached --quiet; then
            echo "source.json already up to date."
            exit 0
          fi

          git commit \
            -m "chore: update SideStore source for Nuvio $VERSION"

          git push origin HEAD:cmp-rewrite

      - name: Build summary
        shell: bash
        env:
          VERSION: ${{ steps.package.outputs.version }}
          BUILD_VERSION: ${{ steps.package.outputs.build_version }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          {
            echo "# Nuvio iOS build completed"
            echo
            echo "- Version: **$VERSION**"
            echo "- Build: **$BUILD_VERSION**"
            echo "- Release: **$RELEASE_TAG**"
            echo "- Distribution: **FULL**"
            echo
            echo "## SideStore source"
            echo
            echo "\`https://raw.githubusercontent.com/$GITHUB_REPOSITORY/cmp-rewrite/sidestore/source.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
