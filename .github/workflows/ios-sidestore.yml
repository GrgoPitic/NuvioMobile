name: Build Nuvio iOS SideStore

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Sync again even if this iOS release already exists"
        required: false
        type: boolean
        default: false

  schedule:
    # Check for a new official Nuvio release every hour.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: nuvio-ios-sidestore
  cancel-in-progress: false

jobs:
  # ============================================================
  # 1. FAST RELEASE CHECK ON LINUX
  # ============================================================
  check:
    name: Check latest Nuvio release
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.detect.outputs.tag }}
      release_tag: ${{ steps.detect.outputs.release_tag }}
      should_sync: ${{ steps.detect.outputs.should_sync }}
      official_ipa_name: ${{ steps.detect.outputs.official_ipa_name }}
      official_ipa_size: ${{ steps.detect.outputs.official_ipa_size }}
      published_at: ${{ steps.detect.outputs.published_at }}

    steps:
      - name: Detect latest release and official FULL IPA
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BUILD: ${{ inputs.force_build }}
        run: |
          set -euo pipefail

          RELEASE_JSON="$(
            gh api repos/NuvioMedia/NuvioMobile/releases/latest
          )"

          TAG="$(
            printf '%s' "$RELEASE_JSON" \
              | jq -r '.tag_name'
          )"

          PUBLISHED_AT="$(
            printf '%s' "$RELEASE_JSON" \
              | jq -r '.published_at // ""'
          )"

          RELEASE_TAG="ios-$TAG"

          OFFICIAL_IPA_NAME="$(
            printf '%s' "$RELEASE_JSON" \
              | jq -r '
                  [
                    .assets[]
                    | select(
                        (.name | ascii_downcase | endswith(".ipa"))
                        and
                        (.name | ascii_downcase | contains("full"))
                      )
                  ][0].name // ""
                '
          )"

          OFFICIAL_IPA_SIZE="$(
            printf '%s' "$RELEASE_JSON" \
              | jq -r --arg name "$OFFICIAL_IPA_NAME" '
                  [
                    .assets[]
                    | select(.name == $name)
                  ][0].size // 0
                '
          )"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "official_ipa_name=$OFFICIAL_IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "official_ipa_size=$OFFICIAL_IPA_SIZE" >> "$GITHUB_OUTPUT"
          echo "published_at=$PUBLISHED_AT" >> "$GITHUB_OUTPUT"

          echo
          echo "Latest official release: $TAG"
          echo "Our release tag:         $RELEASE_TAG"

          if [[ -n "$OFFICIAL_IPA_NAME" ]]; then
            echo "Official FULL IPA:       $OFFICIAL_IPA_NAME"
            echo "Official IPA size:       $OFFICIAL_IPA_SIZE bytes"
          else
            echo "Official FULL IPA:       not available"
            echo "Fallback build will be used if synchronization is needed."
          fi

          if [[ "${FORCE_BUILD:-false}" == "true" ]]; then
            echo "should_sync=true" >> "$GITHUB_OUTPUT"
            echo "Forced synchronization requested."
            exit 0
          fi

          RELEASE_EXISTS="false"

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            RELEASE_EXISTS="true"
          fi

          SOURCE_JSON="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/contents/sidestore/source.json?ref=cmp-rewrite" \
              --jq '.content' 2>/dev/null \
              | tr -d '\n' \
              | base64 --decode 2>/dev/null \
              || true
          )"

          SOURCE_VERSION=""
          SOURCE_DOWNLOAD_URL=""

          if [[ -n "$SOURCE_JSON" ]]; then
            SOURCE_VERSION="$(
              printf '%s' "$SOURCE_JSON" \
                | jq -r '.apps[0].versions[0].version // ""' \
                2>/dev/null \
                || true
            )"

            SOURCE_DOWNLOAD_URL="$(
              printf '%s' "$SOURCE_JSON" \
                | jq -r '.apps[0].versions[0].downloadURL // ""' \
                2>/dev/null \
                || true
            )"
          fi

          if [[ "$RELEASE_EXISTS" == "true" ]] \
            && [[ "$SOURCE_VERSION" == "$TAG" ]] \
            && [[ "$SOURCE_DOWNLOAD_URL" == *"/releases/download/$RELEASE_TAG/"* ]]; then

            echo "should_sync=false" >> "$GITHUB_OUTPUT"

            echo
            echo "Release and SideStore source are already current."
            echo "Nothing to synchronize."

          else

            echo "should_sync=true" >> "$GITHUB_OUTPUT"

            echo

            if [[ "$RELEASE_EXISTS" == "true" ]]; then
              echo "Existing release or SideStore metadata is incomplete/outdated."
              echo "Running self-healing synchronization."
            else
              echo "New Nuvio release detected: $TAG"
            fi
          fi


  # ============================================================
  # 2. PREFER OFFICIAL IPA
  # ============================================================
  prepare_official:
    name: Prepare official Nuvio IPA
    needs: check
    if: needs.check.outputs.should_sync == 'true'

    runs-on: ubuntu-latest

    outputs:
      use_official: ${{ steps.inspect.outputs.use_official }}
      version: ${{ steps.inspect.outputs.version }}
      build_version: ${{ steps.inspect.outputs.build_version }}
      bundle_id: ${{ steps.inspect.outputs.bundle_id }}
      min_os: ${{ steps.inspect.outputs.min_os }}
      minimum_os_label: ${{ steps.inspect.outputs.minimum_os_label }}
      supported_devices: ${{ steps.inspect.outputs.supported_devices }}
      ipa_name: ${{ steps.inspect.outputs.ipa_name }}
      ipa_size: ${{ steps.inspect.outputs.ipa_size }}
      ipa_sha256: ${{ steps.inspect.outputs.ipa_sha256 }}
      ipa_origin: ${{ steps.inspect.outputs.ipa_origin }}

    steps:
      - name: Download and inspect official FULL IPA
        id: inspect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
          OFFICIAL_IPA_NAME: ${{ needs.check.outputs.official_ipa_name }}
          EXPECTED_ASSET_SIZE: ${{ needs.check.outputs.official_ipa_size }}
        run: |
          set -euo pipefail

          echo "use_official=false" >> "$GITHUB_OUTPUT"

          if [[ -z "${OFFICIAL_IPA_NAME:-}" ]]; then
            echo "No official FULL IPA asset is available."
            echo "The macOS fallback build will be used."
            exit 0
          fi

          DOWNLOAD_DIR="$RUNNER_TEMP/official-ipa"
          EXTRACT_DIR="$RUNNER_TEMP/official-ipa-extracted"

          rm -rf "$DOWNLOAD_DIR" "$EXTRACT_DIR"
          mkdir -p "$DOWNLOAD_DIR" "$EXTRACT_DIR"

          echo "Downloading official asset: $OFFICIAL_IPA_NAME"

          if ! gh release download "$UPSTREAM_TAG" \
            --repo NuvioMedia/NuvioMobile \
            --pattern "$OFFICIAL_IPA_NAME" \
            --dir "$DOWNLOAD_DIR"; then

            echo "Official IPA download failed."
            echo "The macOS fallback build will be used."
            exit 0
          fi

          IPA_PATH="$DOWNLOAD_DIR/$OFFICIAL_IPA_NAME"

          if [[ ! -f "$IPA_PATH" ]]; then
            echo "Downloaded IPA was not found."
            echo "The macOS fallback build will be used."
            exit 0
          fi

          IPA_SIZE="$(
            stat -c '%s' "$IPA_PATH"
          )"

          if [[ "${EXPECTED_ASSET_SIZE:-0}" != "0" ]] \
            && [[ "$IPA_SIZE" != "$EXPECTED_ASSET_SIZE" ]]; then

            echo "Official IPA size does not match GitHub metadata."
            echo "Expected: $EXPECTED_ASSET_SIZE"
            echo "Actual:   $IPA_SIZE"
            echo "The macOS fallback build will be used."
            exit 0
          fi

          IPA_SHA256="$(
            sha256sum "$IPA_PATH" \
              | awk '{print $1}'
          )"

          if ! unzip -q "$IPA_PATH" -d "$EXTRACT_DIR"; then
            echo "Official IPA could not be extracted."
            echo "The macOS fallback build will be used."
            exit 0
          fi

          INFO_PLIST="$(
            find "$EXTRACT_DIR/Payload" \
              -maxdepth 2 \
              -type f \
              -name Info.plist \
              | head -n 1
          )"

          if [[ -z "$INFO_PLIST" || ! -f "$INFO_PLIST" ]]; then
            echo "Info.plist was not found inside the official IPA."
            echo "The macOS fallback build will be used."
            exit 0
          fi

          METADATA_FILE="$RUNNER_TEMP/official-ipa-metadata.tsv"

          if ! python3 - "$INFO_PLIST" > "$METADATA_FILE" <<'PY'
          import plistlib
          import sys

          plist_path = sys.argv[1]

          with open(plist_path, "rb") as handle:
              info = plistlib.load(handle)

          version = str(
              info.get("CFBundleShortVersionString", "")
          ).strip()

          build = str(
              info.get("CFBundleVersion", "")
          ).strip()

          bundle_id = str(
              info.get("CFBundleIdentifier", "")
          ).strip()

          min_os = str(
              info.get("MinimumOSVersion", "")
          ).strip()

          raw_families = info.get("UIDeviceFamily", [])

          families = set()

          for value in raw_families:
              try:
                  families.add(int(value))
              except Exception:
                  pass

          has_iphone = 1 in families
          has_ipad = 2 in families

          if has_iphone and has_ipad:
              devices = "iPhone & iPad"
              os_label = f"iOS / iPadOS {min_os}+"
          elif has_ipad:
              devices = "iPad"
              os_label = f"iPadOS {min_os}+"
          elif has_iphone:
              devices = "iPhone"
              os_label = f"iOS {min_os}+"
          else:
              devices = "Not declared"
              os_label = f"Minimum OS {min_os}+"

          required = {
              "version": version,
              "build": build,
              "bundle_id": bundle_id,
              "min_os": min_os,
          }

          missing = [
              key
              for key, value in required.items()
              if not value
          ]

          if missing:
              raise SystemExit(
                  "Missing IPA metadata: "
                  + ", ".join(missing)
              )

          print(
              "\t".join(
                  [
                      version,
                      build,
                      bundle_id,
                      min_os,
                      devices,
                      os_label,
                  ]
              )
          )
          PY
          then
            echo "Official IPA metadata could not be read."
            echo "The macOS fallback build will be used."
            exit 0
          fi

          IFS=$'\t' read -r \
            VERSION \
            BUILD_VERSION \
            BUNDLE_ID \
            MIN_OS \
            SUPPORTED_DEVICES \
            MINIMUM_OS_LABEL \
            < "$METADATA_FILE"

          NORMALIZED_TAG="${UPSTREAM_TAG#v}"

          if [[ "$VERSION" != "$NORMALIZED_TAG" ]]; then
            echo "Official IPA version does not match the release tag."
            echo "Release tag: $UPSTREAM_TAG"
            echo "IPA version: $VERSION"
            echo "The macOS fallback build will be used."
            exit 0
          fi

          # Optional SHA256 cross-check against Nuvio's own
          # published store metadata when available.
          STORE_JSON="$(
            curl -fsSL \
              https://raw.githubusercontent.com/NuvioMedia/NuvioDesktop/Dev/store.json \
              2>/dev/null \
              || true
          )"

          if [[ -n "$STORE_JSON" ]]; then

            EXPECTED_SHA="$(
              printf '%s' "$STORE_JSON" \
                | jq -r \
                  --arg version "$VERSION" '
                    [
                      .apps[].versions[]
                      | select(.version == $version)
                    ][0].sha256 // ""
                  ' \
                2>/dev/null \
                || true
            )"

            if [[ -n "$EXPECTED_SHA" ]] \
              && [[ "$EXPECTED_SHA" != "$IPA_SHA256" ]]; then

              echo "Official IPA SHA256 does not match Nuvio store metadata."
              echo "Expected: $EXPECTED_SHA"
              echo "Actual:   $IPA_SHA256"
              echo "The macOS fallback build will be used."
              exit 0
            fi
          fi

          OUTPUT_DIR="$RUNNER_TEMP/validated-official-ipa"
          IPA_NAME="Nuvio-${VERSION}.ipa"

          mkdir -p "$OUTPUT_DIR"

          # Copy only: the official IPA bytes remain unchanged.
          cp \
            "$IPA_PATH" \
            "$OUTPUT_DIR/$IPA_NAME"

          echo "use_official=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "min_os=$MIN_OS" >> "$GITHUB_OUTPUT"
          echo "minimum_os_label=$MINIMUM_OS_LABEL" >> "$GITHUB_OUTPUT"
          echo "supported_devices=$SUPPORTED_DEVICES" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_size=$IPA_SIZE" >> "$GITHUB_OUTPUT"
          echo "ipa_sha256=$IPA_SHA256" >> "$GITHUB_OUTPUT"
          echo "ipa_origin=Official Nuvio IPA" >> "$GITHUB_OUTPUT"

          echo
          echo "========================================"
          echo "Official Nuvio IPA validated"
          echo "========================================"
          echo "Version:           $VERSION"
          echo "Build:             $BUILD_VERSION"
          echo "Bundle ID:         $BUNDLE_ID"
          echo "Minimum OS:        $MINIMUM_OS_LABEL"
          echo "Supported devices: $SUPPORTED_DEVICES"
          echo "Size:              $IPA_SIZE bytes"
          echo "SHA256:            $IPA_SHA256"
          echo "Source:            Official Nuvio release asset"
          echo "========================================"

      - name: Upload validated official IPA
        if: steps.inspect.outputs.use_official == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: nuvio-ipa
          path: ${{ runner.temp }}/validated-official-ipa/${{ steps.inspect.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


  # ============================================================
  # 3. FALLBACK macOS BUILD
  # ============================================================
  fallback_build:
    name: Build fallback Nuvio IPA
    needs:
      - check
      - prepare_official

    if: >
      needs.check.outputs.should_sync == 'true' &&
      needs.prepare_official.outputs.use_official != 'true'

    runs-on: macos-26
    timeout-minutes: 120

    outputs:
      version: ${{ steps.package.outputs.version }}
      build_version: ${{ steps.package.outputs.build_version }}
      bundle_id: ${{ steps.package.outputs.bundle_id }}
      min_os: ${{ steps.package.outputs.min_os }}
      minimum_os_label: ${{ steps.package.outputs.minimum_os_label }}
      supported_devices: ${{ steps.package.outputs.supported_devices }}
      ipa_name: ${{ steps.package.outputs.ipa_name }}
      ipa_size: ${{ steps.package.outputs.ipa_size }}
      ipa_sha256: ${{ steps.package.outputs.ipa_sha256 }}
      ipa_origin: ${{ steps.package.outputs.ipa_origin }}
      commit_sha: ${{ steps.provenance.outputs.commit_sha }}

    env:
      NUVIO_IOS_DISTRIBUTION: full

      NUVIO_SUPABASE_URL: ${{ secrets.NUVIO_SUPABASE_URL }}
      NUVIO_SUPABASE_ANON_KEY: ${{ secrets.NUVIO_SUPABASE_ANON_KEY }}
      NUVIO_SUPABASE_FALLBACK_URL: ${{ secrets.NUVIO_SUPABASE_FALLBACK_URL }}

      GRADLE_OPTS: -Xmx1536m -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=512m
      KOTLIN_DAEMON_JVMARGS: -Xmx3072m

    steps:
      - name: Clone official Nuvio release
        shell: bash
        env:
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail

          git init .

          git remote add upstream \
            https://github.com/NuvioMedia/NuvioMobile.git

          git fetch \
            --no-tags \
            --depth=1 \
            upstream \
            "refs/tags/$UPSTREAM_TAG"

          git checkout \
            --detach \
            FETCH_HEAD

          echo
          echo "Official Nuvio source ready."
          echo "Tag:    $UPSTREAM_TAG"
          echo "Commit: $(git rev-parse HEAD)"

      - name: Record official source provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_SHA="$(git rev-parse HEAD)"

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

          echo "Official source commit: $COMMIT_SHA"

      - name: Initialize MPVKit submodule
        shell: bash
        run: |
          set -euo pipefail

          git submodule update \
            --init \
            MPVKit

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show build environment
        shell: bash
        run: |
          java -version
          ./gradlew --version
          xcodebuild -version
          echo "Official release: ${{ needs.check.outputs.tag }}"

      - name: Build Nuvio Engine Apple XCFramework
        shell: bash
        run: |
          set -euo pipefail

          ENGINE_DIR="$GITHUB_WORKSPACE/../nuvio-engine"

          rm -rf "$ENGINE_DIR"

          git clone \
            --depth 1 \
            https://github.com/NuvioMedia/nuvio-engine.git \
            "$ENGINE_DIR"

          cd "$ENGINE_DIR"

          NUVIO_BUILD_JOBS=2 \
            ./scripts/build-apple-xcframework.sh

      - name: Build unsigned Nuvio Release
        shell: bash
        run: |
          set -euo pipefail

          touch local.properties

          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/NuvioDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package fallback IPA and read metadata
        id: package
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="$RUNNER_TEMP/NuvioDerivedData/Build/Products/Release-iphoneos/Nuvio.app"

          if [[ ! -d "$APP_PATH" ]]; then
            echo "Nuvio.app was not found at: $APP_PATH" >&2
            exit 1
          fi

          INFO_PLIST="$APP_PATH/Info.plist"

          VERSION="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleShortVersionString' \
              "$INFO_PLIST"
          )"

          BUILD_VERSION="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleVersion' \
              "$INFO_PLIST"
          )"

          BUNDLE_ID="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleIdentifier' \
              "$INFO_PLIST"
          )"

          MIN_OS="$(
            /usr/libexec/PlistBuddy \
              -c 'Print :MinimumOSVersion' \
              "$INFO_PLIST"
          )"

          DEVICE_INFO="$(
            python3 - "$INFO_PLIST" "$MIN_OS" <<'PY'
          import plistlib
          import sys

          plist_path = sys.argv[1]
          min_os = sys.argv[2]

          with open(plist_path, "rb") as handle:
              info = plistlib.load(handle)

          raw_families = info.get("UIDeviceFamily", [])
          families = set()

          for value in raw_families:
              try:
                  families.add(int(value))
              except Exception:
                  pass

          has_iphone = 1 in families
          has_ipad = 2 in families

          if has_iphone and has_ipad:
              devices = "iPhone & iPad"
              os_label = f"iOS / iPadOS {min_os}+"
          elif has_ipad:
              devices = "iPad"
              os_label = f"iPadOS {min_os}+"
          elif has_iphone:
              devices = "iPhone"
              os_label = f"iOS {min_os}+"
          else:
              devices = "Not declared"
              os_label = f"Minimum OS {min_os}+"

          print(f"{devices}\t{os_label}")
          PY
          )"

          SUPPORTED_DEVICES="${DEVICE_INFO%%$'\t'*}"
          MINIMUM_OS_LABEL="${DEVICE_INFO#*$'\t'}"

          IPA_NAME="Nuvio-${VERSION}.ipa"

          PACKAGE_DIR="$RUNNER_TEMP/nuvio-fallback-ipa"
          OUTPUT_DIR="$RUNNER_TEMP/fallback-output"

          rm -rf \
            "$PACKAGE_DIR" \
            "$OUTPUT_DIR"

          mkdir -p \
            "$PACKAGE_DIR/Payload" \
            "$OUTPUT_DIR"

          cp -R \
            "$APP_PATH" \
            "$PACKAGE_DIR/Payload/Nuvio.app"

          (
            cd "$PACKAGE_DIR"

            /usr/bin/zip -qry \
              "$OUTPUT_DIR/$IPA_NAME" \
              Payload
          )

          IPA_SIZE="$(
            stat -f '%z' "$OUTPUT_DIR/$IPA_NAME"
          )"

          IPA_SHA256="$(
            shasum -a 256 "$OUTPUT_DIR/$IPA_NAME" \
              | awk '{print $1}'
          )"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "min_os=$MIN_OS" >> "$GITHUB_OUTPUT"
          echo "minimum_os_label=$MINIMUM_OS_LABEL" >> "$GITHUB_OUTPUT"
          echo "supported_devices=$SUPPORTED_DEVICES" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_size=$IPA_SIZE" >> "$GITHUB_OUTPUT"
          echo "ipa_sha256=$IPA_SHA256" >> "$GITHUB_OUTPUT"
          echo "ipa_origin=Community fallback build from official source" >> "$GITHUB_OUTPUT"

          echo
          echo "========================================"
          echo "Fallback Nuvio IPA built"
          echo "========================================"
          echo "Version:           $VERSION"
          echo "Build:             $BUILD_VERSION"
          echo "Bundle ID:         $BUNDLE_ID"
          echo "Minimum OS:        $MINIMUM_OS_LABEL"
          echo "Supported devices: $SUPPORTED_DEVICES"
          echo "Size:              $IPA_SIZE bytes"
          echo "SHA256:            $IPA_SHA256"
          echo "Source:            Community fallback build"
          echo "========================================"

      - name: Upload fallback IPA
        uses: actions/upload-artifact@v6
        with:
          name: nuvio-ipa
          path: ${{ runner.temp }}/fallback-output/${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0


  # ============================================================
  # 4. NORMALIZED PUBLISH
  # ============================================================
  publish:
    name: Publish SideStore update

    needs:
      - check
      - prepare_official
      - fallback_build

    if: >
      always() &&
      needs.check.outputs.should_sync == 'true' &&
      needs.prepare_official.result == 'success' &&
      (
        needs.prepare_official.outputs.use_official == 'true' ||
        needs.fallback_build.result == 'success'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Resolve IPA metadata
        id: resolved
        shell: bash
        env:
          USE_OFFICIAL: ${{ needs.prepare_official.outputs.use_official }}

          OFFICIAL_VERSION: ${{ needs.prepare_official.outputs.version }}
          OFFICIAL_BUILD: ${{ needs.prepare_official.outputs.build_version }}
          OFFICIAL_BUNDLE_ID: ${{ needs.prepare_official.outputs.bundle_id }}
          OFFICIAL_MIN_OS: ${{ needs.prepare_official.outputs.min_os }}
          OFFICIAL_MINIMUM_LABEL: ${{ needs.prepare_official.outputs.minimum_os_label }}
          OFFICIAL_DEVICES: ${{ needs.prepare_official.outputs.supported_devices }}
          OFFICIAL_IPA_NAME: ${{ needs.prepare_official.outputs.ipa_name }}
          OFFICIAL_IPA_SIZE: ${{ needs.prepare_official.outputs.ipa_size }}
          OFFICIAL_SHA256: ${{ needs.prepare_official.outputs.ipa_sha256 }}
          OFFICIAL_ORIGIN: ${{ needs.prepare_official.outputs.ipa_origin }}

          FALLBACK_VERSION: ${{ needs.fallback_build.outputs.version }}
          FALLBACK_BUILD: ${{ needs.fallback_build.outputs.build_version }}
          FALLBACK_BUNDLE_ID: ${{ needs.fallback_build.outputs.bundle_id }}
          FALLBACK_MIN_OS: ${{ needs.fallback_build.outputs.min_os }}
          FALLBACK_MINIMUM_LABEL: ${{ needs.fallback_build.outputs.minimum_os_label }}
          FALLBACK_DEVICES: ${{ needs.fallback_build.outputs.supported_devices }}
          FALLBACK_IPA_NAME: ${{ needs.fallback_build.outputs.ipa_name }}
          FALLBACK_IPA_SIZE: ${{ needs.fallback_build.outputs.ipa_size }}
          FALLBACK_SHA256: ${{ needs.fallback_build.outputs.ipa_sha256 }}
          FALLBACK_ORIGIN: ${{ needs.fallback_build.outputs.ipa_origin }}
          FALLBACK_COMMIT: ${{ needs.fallback_build.outputs.commit_sha }}
        run: |
          set -euo pipefail

          if [[ "$USE_OFFICIAL" == "true" ]]; then

            VERSION="$OFFICIAL_VERSION"
            BUILD_VERSION="$OFFICIAL_BUILD"
            BUNDLE_ID="$OFFICIAL_BUNDLE_ID"
            MIN_OS="$OFFICIAL_MIN_OS"
            MINIMUM_OS_LABEL="$OFFICIAL_MINIMUM_LABEL"
            SUPPORTED_DEVICES="$OFFICIAL_DEVICES"
            IPA_NAME="$OFFICIAL_IPA_NAME"
            IPA_SIZE="$OFFICIAL_IPA_SIZE"
            IPA_SHA256="$OFFICIAL_SHA256"
            IPA_ORIGIN="$OFFICIAL_ORIGIN"
            SOURCE_REFERENCE="Official release asset"

          else

            VERSION="$FALLBACK_VERSION"
            BUILD_VERSION="$FALLBACK_BUILD"
            BUNDLE_ID="$FALLBACK_BUNDLE_ID"
            MIN_OS="$FALLBACK_MIN_OS"
            MINIMUM_OS_LABEL="$FALLBACK_MINIMUM_LABEL"
            SUPPORTED_DEVICES="$FALLBACK_DEVICES"
            IPA_NAME="$FALLBACK_IPA_NAME"
            IPA_SIZE="$FALLBACK_IPA_SIZE"
            IPA_SHA256="$FALLBACK_SHA256"
            IPA_ORIGIN="$FALLBACK_ORIGIN"
            SOURCE_REFERENCE="$FALLBACK_COMMIT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_version=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          echo "min_os=$MIN_OS" >> "$GITHUB_OUTPUT"
          echo "minimum_os_label=$MINIMUM_OS_LABEL" >> "$GITHUB_OUTPUT"
          echo "supported_devices=$SUPPORTED_DEVICES" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "ipa_size=$IPA_SIZE" >> "$GITHUB_OUTPUT"
          echo "ipa_sha256=$IPA_SHA256" >> "$GITHUB_OUTPUT"
          echo "ipa_origin=$IPA_ORIGIN" >> "$GITHUB_OUTPUT"
          echo "source_reference=$SOURCE_REFERENCE" >> "$GITHUB_OUTPUT"

          echo
          echo "Publishing:"
          echo "Version: $VERSION"
          echo "Build:   $BUILD_VERSION"
          echo "Origin:  $IPA_ORIGIN"

      - name: Download normalized IPA artifact
        uses: actions/download-artifact@v7
        with:
          name: nuvio-ipa
          path: _incoming

      - name: Verify downloaded IPA artifact
        shell: bash
        env:
          IPA_NAME: ${{ steps.resolved.outputs.ipa_name }}
          EXPECTED_SHA256: ${{ steps.resolved.outputs.ipa_sha256 }}
          EXPECTED_SIZE: ${{ steps.resolved.outputs.ipa_size }}
        run: |
          set -euo pipefail

          IPA_PATH="$GITHUB_WORKSPACE/_incoming/$IPA_NAME"

          if [[ ! -f "$IPA_PATH" ]]; then
            echo "IPA artifact was not found: $IPA_PATH" >&2
            exit 1
          fi

          ACTUAL_SIZE="$(
            stat -c '%s' "$IPA_PATH"
          )"

          ACTUAL_SHA256="$(
            sha256sum "$IPA_PATH" \
              | awk '{print $1}'
          )"

          if [[ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]]; then
            echo "IPA size verification failed." >&2
            exit 1
          fi

          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "IPA SHA256 verification failed." >&2
            exit 1
          fi

          echo "IPA artifact verified."

      - name: Prepare official release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
        run: |
          set -euo pipefail

          NOTES_FILE="$RUNNER_TEMP/official-release-notes.md"

          gh api \
            "repos/NuvioMedia/NuvioMobile/releases/tags/$UPSTREAM_TAG" \
            --jq '.body // ""' \
            > "$NOTES_FILE"

          if [[ ! -s "$NOTES_FILE" ]]; then

            PREVIOUS_TAG="$(
              gh api \
                "repos/NuvioMedia/NuvioMobile/releases?per_page=2" \
                --jq '.[1].tag_name // ""'
            )"

            if [[ -n "$PREVIOUS_TAG" ]]; then
              {
                echo "Changes from $PREVIOUS_TAG to $UPSTREAM_TAG:"
                echo

                gh api \
                  "repos/NuvioMedia/NuvioMobile/compare/$PREVIOUS_TAG...$UPSTREAM_TAG" \
                  --jq '.commits[] | "- " + (.commit.message | split("\n")[0])'

              } > "$NOTES_FILE"
            fi
          fi

          if [[ ! -s "$NOTES_FILE" ]]; then
            echo "Nuvio $UPSTREAM_TAG" > "$NOTES_FILE"
          fi

          PUBLISHED_AT="$(
            gh api \
              "repos/NuvioMedia/NuvioMobile/releases/tags/$UPSTREAM_TAG" \
              --jq '.published_at // ""'
          )"

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "published_at=$PUBLISHED_AT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

          UPSTREAM_TAG: ${{ needs.check.outputs.tag }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}

          VERSION: ${{ steps.resolved.outputs.version }}
          BUILD_VERSION: ${{ steps.resolved.outputs.build_version }}
          MINIMUM_OS_LABEL: ${{ steps.resolved.outputs.minimum_os_label }}
          SUPPORTED_DEVICES: ${{ steps.resolved.outputs.supported_devices }}

          IPA_NAME: ${{ steps.resolved.outputs.ipa_name }}
          IPA_SHA256: ${{ steps.resolved.outputs.ipa_sha256 }}
          IPA_ORIGIN: ${{ steps.resolved.outputs.ipa_origin }}
          SOURCE_REFERENCE: ${{ steps.resolved.outputs.source_reference }}

          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail

          IPA_PATH="$GITHUB_WORKSPACE/_incoming/$IPA_NAME"
          RELEASE_NOTES="$RUNNER_TEMP/ios-release-notes.md"

          {
            echo "# Nuvio iOS $VERSION — SideStore Distribution"
            echo
            echo "> [!IMPORTANT]"

            if [[ "$IPA_ORIGIN" == "Official Nuvio IPA" ]]; then

              echo "> The IPA attached to this release is the **official Nuvio FULL IPA**."
              echo "> It was downloaded from the matching NuvioMedia release,"
              echo "> verified, and mirrored here unchanged for the SideStore feed."

            else

              echo "> No usable official FULL IPA was available for this release."
              echo "> This IPA is an **unofficial fallback build** compiled automatically"
              echo "> from the exact matching official Nuvio source release."
            fi

            echo
            echo "## Build information"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Version | \`$VERSION\` |"
            echo "| Build | \`$BUILD_VERSION\` |"
            echo "| Minimum OS | **$MINIMUM_OS_LABEL** |"
            echo "| Supported devices | **$SUPPORTED_DEVICES** |"
            echo "| Distribution | **FULL** |"
            echo "| Signing | **Unsigned IPA** |"
            echo "| IPA source | **$IPA_ORIGIN** |"
            echo "| Official source tag | \`$UPSTREAM_TAG\` |"
            echo "| Source reference | \`$SOURCE_REFERENCE\` |"
            echo "| IPA SHA256 | \`$IPA_SHA256\` |"
            echo
            echo "## What's new"
            echo
            cat "$NOTES_FILE"
            echo
            echo "---"
            echo
            echo "Official project:"
            echo "https://github.com/NuvioMedia/NuvioMobile"

          } > "$RELEASE_NOTES"

          if gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "Release already exists. Updating it."

            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nuvio iOS $VERSION — SideStore Distribution" \
              --notes-file "$RELEASE_NOTES"

            gh release upload "$RELEASE_TAG" \
              "$IPA_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber

          else

            gh release create "$RELEASE_TAG" \
              "$IPA_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Nuvio iOS $VERSION — SideStore Distribution" \
              --notes-file "$RELEASE_NOTES"
          fi

          echo "Release published: $RELEASE_TAG"

      - name: Clone SideStore publishing branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PUBLISH_DIR="$GITHUB_WORKSPACE/_publish"

          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"

          cd "$PUBLISH_DIR"

          git init .

          git remote add origin \
            "https://github.com/$GITHUB_REPOSITORY.git"

          AUTH="$(
            printf 'x-access-token:%s' "$GH_TOKEN" \
              | base64 \
              | tr -d '\n'
          )"

          git \
            -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            fetch \
            --no-tags \
            --depth=1 \
            origin \
            refs/heads/cmp-rewrite

          git checkout \
            -B cmp-rewrite \
            FETCH_HEAD

      - name: Update SideStore source.json
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}

          VERSION: ${{ steps.resolved.outputs.version }}
          BUILD_VERSION: ${{ steps.resolved.outputs.build_version }}
          BUNDLE_ID: ${{ steps.resolved.outputs.bundle_id }}
          MIN_OS: ${{ steps.resolved.outputs.min_os }}

          IPA_NAME: ${{ steps.resolved.outputs.ipa_name }}
          IPA_SIZE: ${{ steps.resolved.outputs.ipa_size }}
          IPA_ORIGIN: ${{ steps.resolved.outputs.ipa_origin }}

          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
          PUBLISHED_AT: ${{ steps.notes.outputs.published_at }}
        run: |
          set -euo pipefail

          SOURCE_DIR="$GITHUB_WORKSPACE/_publish/sidestore"
          SOURCE_FILE="$SOURCE_DIR/source.json"

          mkdir -p "$SOURCE_DIR"

          export SOURCE_FILE

          python3 <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          source_file = Path(
              os.environ["SOURCE_FILE"]
          )

          notes_file = Path(
              os.environ["NOTES_FILE"]
          )

          repo = os.environ["GITHUB_REPOSITORY"]

          version = os.environ["VERSION"]
          build_version = os.environ["BUILD_VERSION"]
          bundle_id = os.environ["BUNDLE_ID"]
          min_os = os.environ["MIN_OS"]

          release_tag = os.environ["RELEASE_TAG"]
          ipa_name = os.environ["IPA_NAME"]
          ipa_size = int(
              os.environ["IPA_SIZE"]
          )

          ipa_origin = os.environ["IPA_ORIGIN"]

          published_at = os.environ[
              "PUBLISHED_AT"
          ].strip()

          published_date = (
              published_at[:10]
              if published_at
              else ""
          )

          notes = notes_file.read_text(
              encoding="utf-8"
          ).strip()

          if not notes:
              notes = f"Nuvio {version}"

          download_url = (
              f"https://github.com/{repo}/releases/download/"
              f"{release_tag}/{ipa_name}"
          )

          release_page_url = (
              f"https://github.com/{repo}/releases/tag/"
              f"{release_tag}"
          )

          source_url = (
              f"https://raw.githubusercontent.com/{repo}/"
              "cmp-rewrite/sidestore/source.json"
          )

          existing = {}

          if source_file.exists():
              try:
                  existing = json.loads(
                      source_file.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception as exc:
                  print(
                      f"Existing source could not be parsed: {exc}"
                  )

          existing_identifier = existing.get(
              "identifier"
          )

          if (
              not isinstance(
                  existing_identifier,
                  str,
              )
              or not existing_identifier.strip()
          ):
              existing_identifier = (
                  "com.grgopitic.nuvio.sidestore"
              )

          existing_app = {}

          for item in existing.get(
              "apps",
              [],
          ):
              if (
                  isinstance(item, dict)
                  and item.get(
                      "bundleIdentifier"
                  ) == bundle_id
              ):
                  existing_app = item
                  break

          icon_url = existing_app.get(
              "iconURL",
              ""
          )

          if not icon_url:
              icon_url = (
                  "https://raw.githubusercontent.com/"
                  "NuvioMedia/NuvioMobile/"
                  f"{version}/iosApp/iosApp/"
                  "Assets.xcassets/AppIcon.appiconset/"
                  "app-icon-1024.png"
              )

          old_versions = existing_app.get(
              "versions",
              []
          )

          allowed_version_keys = {
              "version",
              "date",
              "localizedDescription",
              "downloadURL",
              "size",
              "minOSVersion",
              "maxOSVersion",
          }

          cleaned_versions = []

          for item in old_versions:

              if not isinstance(item, dict):
                  continue

              cleaned = {
                  key: value
                  for key, value in item.items()
                  if key in allowed_version_keys
              }

              required = (
                  "version",
                  "date",
                  "downloadURL",
                  "size",
              )

              if not all(
                  key in cleaned
                  for key in required
              ):
                  continue

              if str(
                  cleaned["version"]
              ) == version:
                  continue

              cleaned_versions.append(
                  cleaned
              )

          latest_version = {
              "version": version,
              "date": published_date,
              "localizedDescription": notes,
              "downloadURL": download_url,
              "size": ipa_size,
              "minOSVersion": min_os,
          }

          versions = [
              latest_version,
              *cleaned_versions,
          ]

          plain = re.sub(
              r"[#*_`>\[\]\(\)]",
              "",
              notes,
          )

          plain = " ".join(
              plain.split()
          )

          caption = plain[:280].strip()

          if len(plain) > 280:
              caption += "…"

          current_news_identifier = (
              f"nuvio-ios-{version}"
          )

          allowed_news_keys = {
              "title",
              "identifier",
              "caption",
              "date",
              "appID",
              "imageURL",
              "notify",
              "tintColor",
              "url",
          }

          old_news = []

          for item in existing.get(
              "news",
              [],
          ):

              if not isinstance(item, dict):
                  continue

              if (
                  item.get("identifier")
                  == current_news_identifier
              ):
                  continue

              cleaned = {
                  key: value
                  for key, value in item.items()
                  if key in allowed_news_keys
              }

              if all(
                  key in cleaned
                  for key in (
                      "title",
                      "identifier",
                      "caption",
                      "date",
                  )
              ):
                  old_news.append(
                      cleaned
                  )

          latest_news = {
              "title": (
                  f"Nuvio {version} is available"
              ),
              "identifier": (
                  current_news_identifier
              ),
              "caption": (
                  caption
                  or f"Nuvio {version} is available."
              ),
              "date": published_date,
              "appID": bundle_id,
              "url": release_page_url,
              "notify": True,
          }

          if ipa_origin == "Official Nuvio IPA":

              subtitle = (
                  "Official Nuvio IPA via community SideStore source"
              )

              description = (
                  "Community-maintained SideStore distribution "
                  "of the official Nuvio FULL IPA. "
                  "The IPA is mirrored unchanged from the matching "
                  "NuvioMedia release."
              )

          else:

              subtitle = (
                  "Community fallback iOS build"
              )

              description = (
                  "Community-maintained fallback FULL IPA compiled "
                  "automatically from the exact matching official "
                  "Nuvio source because no usable official FULL IPA "
                  "asset was available."
              )

          app = {
              "name": "Nuvio",
              "bundleIdentifier": bundle_id,
              "developerName": "NuvioMedia",
              "subtitle": subtitle,
              "localizedDescription": description,
              "iconURL": icon_url,

              "version": version,
              "versionDate": published_date,
              "versionDescription": notes,
              "downloadURL": download_url,
              "size": ipa_size,

              "versions": versions,
          }

          source = {
              "name": "Nuvio iOS SideStore",
              "identifier": (
                  existing_identifier
              ),
              "sourceURL": source_url,
              "apps": [
                  app
              ],
              "news": [
                  latest_news,
                  *old_news,
              ],
          }

          source_file.write_text(
              json.dumps(
                  source,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print()
          print("========================================")
          print("SideStore source updated")
          print("========================================")
          print(f"Version: {version}")
          print(f"Build: {build_version}")
          print(f"Origin: {ipa_origin}")
          print(f"Bundle ID: {bundle_id}")
          print(f"Minimum OS: {min_os}")
          print(f"Download URL: {download_url}")
          print(f"Versions stored: {len(versions)}")
          print("========================================")
          PY

          python3 -m json.tool \
            "$SOURCE_FILE" >/dev/null

          echo "source.json is valid JSON."

      - name: Commit SideStore metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.resolved.outputs.version }}
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/_publish"

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            sidestore/source.json

          if git diff --cached --quiet; then
            echo "SideStore metadata is already current."
            exit 0
          fi

          git commit \
            -m "chore: publish Nuvio iOS $VERSION"

          AUTH="$(
            printf 'x-access-token:%s' "$GH_TOKEN" \
              | base64 \
              | tr -d '\n'
          )"

          git \
            -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            push \
            origin \
            HEAD:cmp-rewrite

          echo "SideStore metadata published."

      - name: Build summary
        shell: bash
        env:
          VERSION: ${{ steps.resolved.outputs.version }}
          BUILD_VERSION: ${{ steps.resolved.outputs.build_version }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          IPA_ORIGIN: ${{ steps.resolved.outputs.ipa_origin }}
          MINIMUM_OS_LABEL: ${{ steps.resolved.outputs.minimum_os_label }}
          SUPPORTED_DEVICES: ${{ steps.resolved.outputs.supported_devices }}
          IPA_SHA256: ${{ steps.resolved.outputs.ipa_sha256 }}
        run: |
          {
            echo "# Nuvio SideStore synchronization completed"
            echo
            echo "- Version: **$VERSION**"
            echo "- Build: **$BUILD_VERSION**"
            echo "- Release: **$RELEASE_TAG**"
            echo "- IPA source: **$IPA_ORIGIN**"
            echo "- Minimum OS: **$MINIMUM_OS_LABEL**"
            echo "- Supported devices: **$SUPPORTED_DEVICES**"
            echo "- Distribution: **FULL**"
            echo "- Signing: **Unsigned IPA**"
            echo "- SHA256: \`$IPA_SHA256\`"
            echo
            echo "## SideStore source"
            echo
            echo "\`https://raw.githubusercontent.com/$GITHUB_REPOSITORY/cmp-rewrite/sidestore/source.json\`"
            echo
            echo "The separate Refresh Nuvio Homepage workflow will update the polished EN / SK / CZ pages."
          } >> "$GITHUB_STEP_SUMMARY"
